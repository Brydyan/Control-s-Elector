services:
  postgres:
    image: postgres:16                                                              
    environment:
      POSTGRES_DB: electoral_db                                                     
      POSTGRES_USER: electoral_user                                               
      POSTGRES_PASSWORD: electoral_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
                                                                                    
volumes:
  postgres_data: