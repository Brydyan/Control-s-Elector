# Marks this directory as its own pnpm workspace root so pnpm does not
# walk up and attach the project to an ancestor workspace (e.g. $HOME).
packages: []

# Build scripts required by the Angular toolchain (native binaries / caches).
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Security patches: force patched versions of vulnerable transitive
# build-time dependencies (all same-major patch bumps). See `pnpm audit`.
overrides:
  vite: '>=7.3.5'
  http-proxy-middleware: '>=3.0.7'
  piscina: '>=5.1.5'
  webpack-dev-server: '>=5.2.5'
  uuid: '>=11.1.1'
  esbuild: '>=0.28.1'
  '@babel/core': '>=7.29.1'
