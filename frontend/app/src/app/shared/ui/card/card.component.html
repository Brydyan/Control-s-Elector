<div
  class="app-card"
  [class.app-card--bordered]="bordered"
  [class.app-card--elevated]="elevated"
>
  <header *ngIf="headerTitle || subtitle" class="app-card__header">
    <div class="app-card__title-group">
      <h3 *ngIf="headerTitle" class="app-card__title">{{ headerTitle }}</h3>
      <p *ngIf="subtitle" class="app-card__subtitle">{{ subtitle }}</p>
    </div>
    <div class="app-card__header-actions">
      <ng-content select="[card-header-actions]"></ng-content>
    </div>
  </header>

  <div class="app-card__body">
    <ng-content></ng-content>
  </div>

  <footer class="app-card__footer">
    <ng-content select="[card-footer]"></ng-content>
  </footer>
</div>
