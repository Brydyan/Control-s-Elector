<p-card [styleClass]="styleClass">
  <ng-template #header>
    @if (headerTitle || subtitle) {
      <div class="app-card__header">
        <div class="app-card__title-group">
          @if (headerTitle) {
            <h3 class="app-card__title">{{ headerTitle }}</h3>
          }
          @if (subtitle) {
            <p class="app-card__subtitle">{{ subtitle }}</p>
          }
        </div>
        <div class="app-card__header-actions">
          <ng-content select="[card-header-actions]"></ng-content>
        </div>
      </div>
    }
  </ng-template>

  <ng-content></ng-content>

  <ng-template #footer>
    <ng-content select="[card-footer]"></ng-content>
  </ng-template>
</p-card>
