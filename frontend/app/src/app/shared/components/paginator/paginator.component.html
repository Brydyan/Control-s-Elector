<div class="paginator" *ngIf="totalPages > 1">
  <app-button
    variant="secondary"
    size="sm"
    (clicked)="previous()"
    [disabled]="page <= 0"
  >
    Anterior
  </app-button>
  <span class="paginator-info" aria-live="polite">
    Página {{ page + 1 }} de {{ totalPages }} · {{ totalElements }} total
  </span>
  <app-button
    variant="secondary"
    size="sm"
    (clicked)="next()"
    [disabled]="page + 1 >= totalPages"
  >
    Siguiente
  </app-button>
  <select
    class="page-size-select"
    (change)="changeSize($event)"
    aria-label="Elementos por página"
  >
    <option *ngFor="let t of pageSizes" [value]="t" [selected]="t === size">
      {{ t }} / pág.
    </option>
  </select>
</div>
