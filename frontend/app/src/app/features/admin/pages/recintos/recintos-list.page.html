<div class="recintos-container">
  <div class="page-header">
    <div>
      <h1>Gestión de Recintos</h1>
      <span class="subtitle">{{ totalElements() }} recintos registrados</span>
    </div>
    <app-button (clicked)="abrirFormularioCrear()">
      <i class="pi pi-plus" aria-hidden="true"></i>
      <span>Crear recinto</span>
    </app-button>
  </div>

  <app-error-state
    *ngIf="error() && !loading()"
    title="Error al cargar recintos"
    [message]="error() ?? undefined"
  >
    <app-button variant="primary" (clicked)="cargarRecintos()">
      Reintentar
    </app-button>
  </app-error-state>

  <div class="filters">
    <div class="filter-group">
      <label>Estado:</label>
      <p-select
        [(ngModel)]="estadoSeleccionado"
        [options]="[
          { label: 'Todos', value: '' },
          { label: 'Activo', value: 'ACTIVO' },
          { label: 'Inactivo', value: 'INACTIVO' }
        ]"
        optionLabel="label"
        optionValue="value"
        (onChange)="onEstadoChange()"
      ></p-select>
    </div>
  </div>

  <div class="table-wrapper">
    <app-table
      [data]="recintos()"
      [columns]="tableColumns"
      [loading]="loading()"
      [actions]="obtenerAccionesRecinto.bind(this)"
      emptyTitle="No hay recintos"
      emptyDescription="Crea un nuevo recinto para comenzar."
      emptyIcon="pi pi-building"
      mobileTitleColumn="nombre"
    >
      <ng-template appTableCell="nombre" let-recinto>
        <strong>{{ recinto.nombre }}</strong>
      </ng-template>

      <ng-template appTableCell="estado" let-recinto>
        <span
          [class]="'status ' + (recinto.estado === 'ACTIVO' ? 'active' : 'inactive')"
        >
          {{ recinto.estado }}
        </span>
      </ng-template>
    </app-table>

    <app-paginator
      *ngIf="!loading() && recintos().length > 0"
      [page]="page"
      [size]="size"
      [totalElements]="totalElements()"
      (pageChange)="onPageChange($event)"
      (sizeChange)="onSizeChange($event)"
    ></app-paginator>
  </div>

  <app-recinto-form-modal
    [abierto]="modalFormAbierto"
    [recinto]="recintoSeleccionado"
    [modoEdicion]="modoEdicion"
    (guardado)="onFormGuardado()"
    (cancelado)="onFormCancelado()"
  ></app-recinto-form-modal>

  <app-recinto-jrvs-modal
    [abierto]="modalJrvsAbierto"
    [recinto]="recintoSeleccionado"
    (guardado)="onJrvsGuardado()"
    (cancelado)="onJrvsCancelado()"
    (jrvsModificadas)="onJrvsModificadas()"
  ></app-recinto-jrvs-modal>
</div>
