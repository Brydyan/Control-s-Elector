<header class="topbar">
  <div class="topbar-left">
    <button
      class="menu-btn"
      type="button"
      (click)="layout.toggleSidebar()"
      [attr.aria-label]="
        layout.desktopCollapsed()
          ? 'Expandir menú lateral'
          : 'Contraer menú lateral'
      "
      [attr.title]="
        layout.desktopCollapsed()
          ? 'Expandir menú lateral'
          : 'Contraer menú lateral'
      "
    >
      <ion-icon
        class="menu-icon"
        name="menu-outline"
        aria-hidden="true"
      ></ion-icon>
    </button>

    <div class="topbar-title">
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="topbar-right">
    <div
      class="realtime-pill"
      [class.status-online]="network.status() === 'ONLINE'"
      [class.status-reconnecting]="network.status() === 'RECONNECTING'"
      [class.status-offline]="network.status() === 'OFFLINE'"
      [attr.aria-label]="network.statusLabel()"
      role="status"
    >
      <span class="dot" aria-hidden="true"></span>
      {{ network.statusLabel() }}
    </div>

    <button class="bell-btn" type="button" aria-label="Notificaciones">
      <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
      @if (notifications() > 0) {
        <span class="bell-badge">{{ notifications() }}</span>
      }
    </button>

    @if (isReadOnly()) {
      <div class="readonly-badge">👁️ Solo lectura</div>
    }
  </div>
</header>
