<header class="topbar">
  <div class="topbar-left">
    <button
      class="menu-btn"
      type="button"
      (click)="layout.toggleSidebar()"
      aria-label="Abrir menú de navegación"
    >
      <span class="menu-icon">☰</span>
    </button>

    <div class="topbar-title">
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="topbar-right">
    <div class="realtime-pill">
      <span class="dot"></span>
      En vivo · Tiempo real
    </div>

    <button class="bell-btn" type="button" aria-label="Notificaciones">
      🔔
      @if (notifications() > 0) {
        <span class="bell-badge">{{ notifications() }}</span>
      }
    </button>

    @if (isReadOnly()) {
      <div class="readonly-badge">👁️ Solo lectura</div>
    }
  </div>
</header>
