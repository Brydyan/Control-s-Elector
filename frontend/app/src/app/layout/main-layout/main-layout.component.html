<div class="layout">
  <div
    class="sidebar-backdrop"
    [class.visible]="layout.sidebarOpen()"
    (click)="layout.closeSidebar()"
    aria-hidden="true"
  ></div>

  <app-sidebar></app-sidebar>

  <div class="main">
    <app-topbar
      [title]="meta().title"
      [subtitle]="meta().subtitle"
      [notifications]="meta().notifications"
    ></app-topbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
