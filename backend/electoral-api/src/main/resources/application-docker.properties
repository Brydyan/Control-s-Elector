# =============================================================================
# application-docker.properties
# =============================================================================
# Configuración para entornos Docker y producción
# Usar con: SPRING_PROFILES_ACTIVE=prod,docker
# =============================================================================

# ─── Base de datos ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:electoral_db}
spring.datasource.username=${DB_USER:electoral_user}
spring.datasource.password=${DB_PASSWORD:electoral_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones optimizado para Docker/producción
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
# Usar 'validate' en prod real, 'update' en dev/staging para auto-create tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:electoral-api}

# ─── Storage S3 (RustFS local o Supabase producción) ──────────────────────────
# AWS SDK v2 — properties leídas por S3Properties / S3Config
aws.access-key-id=${AWS_ACCESS_KEY_ID:rustfsadmin}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:rustfsadmin123}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://rustfs:9000}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:electoral-evidences}
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE:true}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.ec.twintailcs=${LOGGING_LEVEL_EC_TWINTAILCS:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:INFO}

# ─── Actuator (health checks) ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
