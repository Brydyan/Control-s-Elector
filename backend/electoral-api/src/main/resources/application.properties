# ─── Base de datos (desarrollo local — overrides con Docker) ──────────────────
# En Docker usar variables de entorno o application-docker.properties
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electoral_db}
spring.datasource.username=${DB_USER:electoral_user}
spring.datasource.password=${DB_PASSWORD:electoral_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# override con: SPRING_JPA_HIBERNATE_DDL_AUTO=update (dev) | validate (prod)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=electoral-api

# ─── Perfiles activos ──────────────────────────────────────────────────────────
# override con: SPRING_PROFILES_ACTIVE=dev,docker (Docker) | prod,docker (prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ─── Actuator (health checks en Docker) ───────────────────────────────────────
# /actuator/health expone el estado de S3 (S3HealthIndicator) además de DB y disco.
# En dev show-details=always para ver cada contributor. En prod cambiar a when_authorized.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.s3.enabled=true

# ─── AWS SDK / S3 ──────────────────────────────────────────────────────────────
# Credenciales (en prod real: variables de entorno inyectadas por Railway / Supabase)
aws.access-key-id=${AWS_ACCESS_KEY_ID:rustfsadmin}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:rustfsadmin123}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:electoral-evidences}
# S3-compatible local (RustFS/MinIO) requiere path-style; AWS real usa virtual-hosted.
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE:true}

# ─── Multipart upload (max 10 MB por archivo) ─────────────────────────────────
# Coincide con MAX_SIZE_BYTES de EvidenciaService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.enabled=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# SECRET: DEV-only default. En prod usar app.jwt.secret de variable de
# entorno (Railway / Vault / etc). Minimo 32 caracteres (256 bits HS256).
# Cambiar SIEMPRE antes de subir a prod.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-in-prod-32chars-min-jwt-hmac-key}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:7d}
app.jwt.issuer=${APP_JWT_ISSUER:control-elector}
# Pepper adicional para hashear el refresh token. NO compartir con JWT secret.
app.jwt.refresh-pepper=${APP_JWT_REFRESH_PEPPER:dev-only-control-elector-refresh-pepper}

# ─── Seed inicial (usuario admin) ──────────────────────────────────────────────
# DEV-only. En prod configurar via secrets de la plataforma.
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@control-elector.local}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin12345}
