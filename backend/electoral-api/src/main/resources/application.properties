# ─── Base de datos (Docker local) ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/electoral_db
spring.datasource.username=electoral_user
spring.datasource.password=electoral_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=electoral-api
