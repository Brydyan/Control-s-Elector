# ─── Base de datos (desarrollo local — overrides con Docker) ──────────────────
# En Docker usar variables de entorno o application-docker.properties
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electoral_db}
spring.datasource.username=${DB_USER:electoral_user}
spring.datasource.password=${DB_PASSWORD:electoral_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Liquibase — versionamiento de schema ────────────────────────────────────
# Liquibase crea y versiona el schema. Hibernate solo valida.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:database/db.changelog-master.yaml
# Contexto "seed": corre el seed de datos de referencia (025-data-seed.sql).
# Sin este contexto, una base nueva queda sin JRVs, cargos, candidatos ni
# usuarios, y el sistema es inutilizable. La suite de tests NO usa este
# contexto: corre solo el esquema (el pom le pasa schema-only), porque sus
# fixtures construyen su propia geografía y afirman una base vacía.
spring.liquibase.contexts=seed

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# validate: Liquibase crea el schema; Hibernate verifica que entidades matcheen.
# override con: SPRING_JPA_HIBERNATE_DDL_AUTO=update (dev emergency) | validate (default/prod)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Servidor ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=electoral-api

# ─── Perfiles activos ──────────────────────────────────────────────────────────
# override con: SPRING_PROFILES_ACTIVE=dev,docker (Docker) | prod,docker (prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ─── Actuator (health checks en Docker) ───────────────────────────────────────
# /actuator/health expone el estado de S3 (S3HealthIndicator) además de DB y disco.
# En dev show-details=always para ver cada contributor. En prod cambiar a when_authorized.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.s3.enabled=true

# ─── AWS SDK / S3 ──────────────────────────────────────────────────────────────
# Credenciales (en prod real: variables de entorno inyectadas por Railway / Supabase)
aws.access-key-id=${AWS_ACCESS_KEY_ID:rustfsadmin}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:rustfsadmin123}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:electoral-evidences}
# S3-compatible local (RustFS/MinIO) requiere path-style; AWS real usa virtual-hosted.
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE:true}
# RF-STO-07: Expiración de presigned URLs configurable (default 15 min; prod Railway baja a 5).
aws.s3.presign-expiry=${AWS_S3_PRESIGN_EXPIRY:PT15M}

# ─── Multipart upload (max 10 MB por archivo) ─────────────────────────────────
# Coincide con MAX_SIZE_BYTES de EvidenciaService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.enabled=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# SECRET: DEV-only default. En prod usar app.jwt.secret de variable de
# entorno (Railway / Vault / etc). Minimo 32 caracteres (256 bits HS256).
# Cambiar SIEMPRE antes de subir a prod.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-in-prod-32chars-min-jwt-hmac-key}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:7d}
app.jwt.issuer=${APP_JWT_ISSUER:control-elector}
# Pepper adicional para hashear el refresh token. NO compartir con JWT secret.
app.jwt.refresh-pepper=${APP_JWT_REFRESH_PEPPER:dev-only-control-elector-refresh-pepper}

# ─── Seed inicial (usuario admin) ──────────────────────────────────────────────
# DEV-only. En prod configurar via secrets de la plataforma.
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@control-elector.local}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin12345}

# ─── OpenAPI / Swagger UI (springdoc-openapi 3.x) ──────────────────────────────
# Paths por defecto cambiados para que vivan bajo /api/v1 (no filtran metadata
# del framework). En prod detrás de API gateway, restringir acceso por IP/SSO.
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
# Operadores y tags ordenados alfabeticamente — la API crece por modulos
# (auth, evidencia, acta, jrv...) y el orden por declaracion se vuelve ruidoso.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
# Paths exactos escaneados para generar el spec. Cubre los modulos actuales y
# los futuros (acta, jrv, candidato...). Ajustar si se agrega un modulo nuevo.
springdoc.packages-to-scan=ec.twintailcs.electoral
# Por defecto springdoc 3.x emite OpenAPI 3.1. Fijar explicitamente para que
# herramientas downstream (openapi-generator-cli, Spectral) no asuman 3.0.
springdoc.api-docs.version=OPENAPI_3_1
