# Registro de reflexion para Cache Phase 2 Valkey (native image)
#
# CacheDeLectura.typeLiteral() usa reflexion para acceder a TypeLiteral.actualType (campo privado)
# con el fin de deserializar tipos genéricos (List<Cargo>, etc) en la cache Redis/Valkey.
#
# Sin este registro, GraalVM impide el acceso al campo privado en native image:
# InaccessibleObjectException -> cache degrada a siempre-miss -> cache_hits = 0.
#
# Referencia:
# - CacheDeLectura.java línea 299-312 (typeLiteral method)
# - CacheDeLecturaValkeyIT.java línea 69 (testReadWithGenericType assertion)
# - ci-native.yml: verifica cache.hits >= 1 en binario nativo

# Permitir reflexion sobre TypeLiteral.actualType (private field)
Args = -H:ReflectionConfigurationResources=reflection-config.json
