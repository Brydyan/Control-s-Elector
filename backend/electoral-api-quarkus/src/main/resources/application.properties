# ─── Servidor ─────────────────────────────────────────────────────────────────
# Mismo puerto y mismo path de health que el backend Spring: el strangler y el
# job de CI no tienen que saber qué implementación hay detrás.
quarkus.http.port=${SERVER_PORT:8080}
# El management interface de Quarkus corre en un puerto PROPIO (9000 por
# defecto) y no monta sus rutas en el servidor principal aunque se le configure
# el mismo numero de puerto. Por eso el health canonico lo expone
# shared/web/HealthAliasResource en /actuator/health del puerto principal: asi
# las dos implementaciones (Spring y Quarkus) son intercambiables sin tocar el
# probe de Kubernetes ni el proxy del strangler.
quarkus.management.enabled=false
quarkus.management.root-path=/actuator
quarkus.management.port=${QUARKUS_MANAGEMENT_PORT:9000}

# ─── Base de datos ───────────────────────────────────────────────────────────
# Mismas variables de entorno que el backend Spring (DB_HOST, DB_PORT, ...).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:electoral_user}
quarkus.datasource.password=${DB_PASSWORD:electoral_pass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electoral_db}

# ─── Liquibase ───────────────────────────────────────────────────────────────
# El changelog vive en src/main/resources/database: este módulo es su único
# dueño. Durante el strangler el archivo se copiaba desde el backend Spring, que
# era el que migraba; ahora que la implementación es una sola, la migración queda
# en ON por defecto. Ver README.md para el arranque en dos fases contra una base
# vacía (Liquibase crea el schema, Hibernate valida después).
quarkus.liquibase.migrate-at-start=${QUARKUS_LIQUIDASE_MIGRATE_AT_START:true}
quarkus.liquibase.change-log=database/db.changelog-master.yaml
# Contexto "seed": corre el seed de datos de referencia. "schema-only" lo deja
# fuera (es lo que usa la suite de tests, que construye su propia geografía).
quarkus.liquibase.contexts=${QUARKUS_LIQUIDASE_CONTEXTS:seed}
# validate-on-migrate off: el DATABASECHANGELOG de los ambientes existentes lo
# escribio el cliente Liquibase del backend Spring (5.0.3), no este. Encender la
# validacion en el mismo PR que cambia el runtime-turned es pedirle a produccion
# que verifique checksums contra un cliente que nunca los escribio: si no
# coinciden, la app no arranca y el corte se ve como una caida. Cuando el schema
# se haya re-baselined por Quarkus, esto se enciende en un PR propio.
quarkus.liquibase.validate-on-migrate=${QUARKUS_LIQUIDASE_VALIDATE_ON_MIGRATE:false}

# ─── Hibernate ORM ───────────────────────────────────────────────────────────
# Igual que el backend Spring: Liquibase crea el schema, Hibernate solo valida.
#
# El nombre fisico de cada columna va EXPLICITO en las entidades (@Column(name=...)).
# Spring usa CamelCaseToUnderscores y Quarkus no aplica ninguna conversion por
# defecto, asi que dejarlo a la convencion implicita hacia que las dos
# implementaciones no mapeen el mismo schema. Declararlo en cada campo hace que
# el mapeo no dependa de ninguna convencion.
# Igual que el backend Spring (ddl-auto=validate): el schema tiene que coincidir o la
# app no arranca. Con `none` lo deja crear Liquibase sin validarlo, que es lo que hay
# que usar la PRIMERA vez contra una base vacia (Liquibase corre despues de la
# validacion de Hibernate, asi que con `validate` la base vacia revienta).
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_GENERATION:validate}
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.jdbc.timezone=UTC

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Mismos nombres de variable que el backend Spring. El token se firma con Nimbus
# igual que allá, así que es byte-compatible entre las dos implementaciones.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-in-prod-32chars-min-jwt-hmac-key}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:7d}
app.jwt.issuer=${APP_JWT_ISSUER:control-elector}
app.jwt.refresh-pepper=${APP_JWT_REFRESH_PEPPER:dev-only-control-elector-refresh-pepper}
# Vigencia del token de activacion de las invitaciones (T-AUTH-INV-01). El spec
# fija 24 horas: es tiempo de sobra para que el observador lea el email y elija
# su contrasena, y corto para que un link olvidado no sirva indefinidamente.
app.jwt.activation-ttl=${APP_JWT_ACTIVATION_TTL:24h}

# ─── Email / invitaciones ─────────────────────────────────────────────────────
# Proveedor de email. La decision D7 del design deja el proveedor intercambiable:
# el bean SMTP solo existe si esta propiedad vale "smtp", y cambiar el valor
# cambia la implementacion sin tocar la logica de invitacion.
app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.email.from=${APP_EMAIL_FROM:noreply@control.electoral.ec}
# URL publica del frontend. Es la base del link de activacion que viaja en el
# email: si aponta al lugar equivocado, el link lleva a una pagina rota.
app.public.frontend-url=${APP_PUBLIC_FRONTEND_URL:http://localhost:4200}

# SMTP. Las credenciales salen del entorno; en el repositorio no hay ninguna.
# Los defaults apuntan a un servidor local sin autenticacion, que es lo que hay
# en desarrollo (MailHog / Mailpit). En staging y produccion se sobreescriben.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
# STARTTLS apagado por defecto: en desarrollo el servidor local no lo habla, y
# con STARTTLS activado el cliente exige el handshake y falla el envio.
# Ojo: la propiedad es un enum (DISABLED | OPTIONAL | REQUIRED), no un booleano.
quarkus.mailer.start-tls=${SMTP_STARTTLS:DISABLED}
# Si el SMTP no responde, no colgamos el worker de la cola.
quarkus.mailer.timeout=${SMTP_TIMEOUT:10000}

# Cola de email. La cola vive en memoria del proceso: los envios pendientes se
# pierden si el proceso muere, y por eso el flujo deja registro de cada intento
# y el MASTER puede reenviar a mano (decision D5 del design).
app.email.queue.batch-size=${APP_EMAIL_QUEUE_BATCH_SIZE:10}
app.email.queue.poll-interval-ms=${APP_EMAIL_QUEUE_POLL_INTERVAL_MS:5000}
app.email.queue.rate-limit=${APP_EMAIL_QUEUE_RATE_LIMIT:100}
app.email.queue.rate-limit-window-seconds=${APP_EMAIL_QUEUE_RATE_LIMIT_WINDOW_SECONDS:60}
app.email.queue.capacity=${APP_EMAIL_QUEUE_CAPACITY:5000}
# Reintentos con backoff exponencial: 1 intento, 2 y 4 segundos entre intentos.
app.email.retry.max-attempts=${APP_EMAIL_RETRY_MAX_ATTEMPTS:3}
app.email.retry.initial-delay-ms=${APP_EMAIL_RETRY_INITIAL_DELAY_MS:1000}
app.email.retry.backoff-multiplier=${APP_EMAIL_RETRY_BACKOFF_MULTIPLIER:2}

# Plantillas HTML del email: van incluidas en la imagen nativa de forma
# explicita, porque se leen del classpath en runtime.
quarkus.native.resources.includes=email/**

# ─── OpenAPI ─────────────────────────────────────────────────────────────────
# Mismo path que el backend Spring para que el spec se pueda diffear.
quarkus.smallrye-openapi.info-title=Control Electoral API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.always-include=true

# ─── Log ─────────────────────────────────────────────────────────────────────
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."ec.twintailcs.electoral".level=${APP_LOG_LEVEL:INFO}

# ─── Native ──────────────────────────────────────────────────────────────────
# El arranque en nativo es lo que motiva la migracion (ver issue #113).
#
# PENDIENTE (fase 2, issue #114): el build nativo del backend COMPLETO todavia
# no cierra. El OpenPDF referencia FopGlyphProcessor, que a su vez referencia
# org.apache.fop.complexscripts.util.GlyphSequence, de la dependencia opcional
# de FOP. Sin FOP en el classpath el build falla con "Discovered unresolved
# type during parsing: org.apache.fop.complexscripts.util.GlyphSequence".
# Con FOP aparece detras la cadena de commons-logging (Log4JLogger ->
# LogFactoryImpl -> org.apache.log4j.Priority) y el build sigue sin cerrar.
# Las tres salidas posibles estan en la issue #114.
#
# NTLMEngineImpl (del cliente HTTP de Apache que usa el AWS SDK v2) crea un
# SecureRandom en el inicializador de clase. Graal lo hornea en el heap de la
# imagen con la semilla cacheada, y ahi no se comporta como se espera: el
# build falla con "Detected an instance of Random/SplittableRandom class in the
# image heap". Inicializar esa clase en tiempo de ejecucion lo evita.
#
# Lo mismo con UsuarioAdminService: tiene un SecureRandom estatico (para generar
# la password temporal) que Graal hornea con la semilla cacheada. La clase se
# inicializa en runtime y el SecureRandom se crea de verdad en cada arranque.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.http.impl.auth.NTLMEngineImpl,--initialize-at-run-time=ec.twintailcs.electoral.auth.application.UsuarioAdminService
