# ─── Servidor ─────────────────────────────────────────────────────────────────
# Mismo puerto y mismo path de health que el backend Spring: el strangler y el
# job de CI no tienen que saber qué implementación hay detrás.
quarkus.http.port=${SERVER_PORT:8080}
# El management interface de Quarkus corre en un puerto PROPIO (9000 por
# defecto) y no monta sus rutas en el servidor principal aunque se le configure
# el mismo numero de puerto. Por eso el health canonico lo expone
# shared/web/HealthAliasResource en /actuator/health del puerto principal: asi
# las dos implementaciones (Spring y Quarkus) son intercambiables sin tocar el
# probe de Kubernetes ni el proxy del strangler.
#
# El management interface se usa SOLO para las metricas (/actuator/metrics en el
# puerto 9180): ese puerto no se publica a internet (Railway expone solo el
# principal), asi las metricas quedan fuera del alcance publico y las lee un
# scraper por la red privada. El health se queda en el puerto principal
# (smallrye-health.management.enabled=false) para no mover el probe.
# No es 9000 (el default de Quarkus) porque ahi corre RustFS/MinIO en CI y en
# desarrollo, y el smoke test del CI comparte la red del host.
#
# Con el management interface habilitado, Quarkus saca el export de Prometheus
# del puerto principal: /q/metrics deja de existir ahi. El SDD de cache (D.5) lo
# declara PUBLICO y scrapeable, asi que shared/web/MetricsAliasResource lo
# vuelve a publicar en /q/metrics del puerto principal leyendo el management
# interface por HTTP. No hay que cambiar nada de esta configuracion para que
# las metricas vuelvan a estar donde el scraper las encuentra.
quarkus.management.enabled=true
quarkus.management.root-path=/actuator
quarkus.management.port=${QUARKUS_MANAGEMENT_PORT:9180}
quarkus.smallrye-health.management.enabled=false
# OpenAPI y Swagger UI tambien se quedan en el puerto principal (/v3/api-docs): al
# activar el management interface Quarkus los mueve ahi por defecto.
quarkus.smallrye-openapi.management.enabled=false

# ─── CORS ─────────────────────────────────────────────────────────────────────
# La SPA y la API se sirven en el MISMO origen en produccion (nginx del frontend
# hace proxy de /api al backend), asi que el camino normal NO necesita CORS:
# es same-origin y la cookie httpOnly del refresh viaja sin drama.
#
# CORS existe para los clientes que SI cruzan de origen:
#
#   - la API se publica ademas en https://api.twintailcs.xyz (ingress propio),
#     y la SPA vive en https://control.twintailcs.xyz: si alguien llama a la API
#     por su hostname en vez de por el proxy, el navegador exige CORS.
#   - el cliente movil (Capacitor) corre en su propio origen.
#   - el servidor de desarrollo de Angular (localhost:4200 / 4300).
#
# Fail-closed: la lista SIEMPRE sale de CORS_ALLOWED_ORIGINS. El default de
# abajo es solo para desarrollo local. En produccion la sobreescribe el
# ConfigMap de k8s; si ahi faltara, la API responde sin cabeceras CORS y el
# navegador bloquea — que es el fallo seguro. Nunca "*": con
# access-control-allow-credentials=true el comodin es invalido por spec (ACAO
# no puede ser "*" cuando el modo de credenciales es "include") y abriria la
# API a cualquier pagina que conozca el dominio.
#
# La propiedad es `quarkus.http.cors.enabled`: `quarkus.http.cors` a secas no
# existe y Quarkus la ignora en silencio (CORS queda apagado sin avisar).
quarkus.http.cors.enabled=${CORS_ENABLED:true}
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,capacitor://localhost,http://localhost}
# PATCH no es opcional: lo usa EvidenciaResource (estado y observaciones de
# evidencia). HEAD y OPTIONS los necesita el propio navegador para el preflight.
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS
# Cabeceras que el navegador puede mandar. NO va X-Forwarded-For: es un header
# de hop-by-hop que el navegador prohibe setear desde JS, y listarlo como
# "allowed" abre la puerta a que un cliente origine ese valor. Quarkus lo
# maneja aparte, con quarkus.http.proxy.*.
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
# Cabeceras expuestas: las del 429 de rate limiting. La SPA de produccion (Cloudflare
# Pages, control.brydyan.me) llama a api.brydyan.me de otro origen, y sin listarlas
# el navegador no deja leer Retry-After (el frontend lo usa para esperar antes de
# reintentar). Content-Length y Content-Type ya entran por la safelist de CORS. Si se
# agrega otro header de respuesta que el frontend lea, hay que sumarlo aqui.
quarkus.http.cors.exposed-headers=Retry-After,RateLimit-Limit,RateLimit-Remaining
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600

# ─── Compresion HTTP ─────────────────────────────────────────────────────────
# gzip en las respuestas (T-PERF-OPT-01 D.1). El dashboard y los listados de actas
# viajan con mucho texto repetido (nombres, estados, JSON con claves iguales): el
# ratio ronda 10:1, y en un cliente movil por 4G esa diferencia se nota mas que
# cualquier microoptimizacion de codigo.
#
# Nivel 6: el default de Quarkus es 4; 6 comprime notablemente mejor sin el costo
# de CPU de 9. Quarkus 3.40 no tiene umbral de tamano: comprime lo que declare
# compress-media-types, asi que el filtro real son los tipos (JSON, HTML, texto),
# no los bytes.
quarkus.http.enable-compression=true
quarkus.http.compression-level=6

# ─── Base de datos ───────────────────────────────────────────────────────────
# Mismas variables de entorno que el backend Spring (DB_HOST, DB_PORT, ...).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:electoral_user}
quarkus.datasource.password=${DB_PASSWORD:electoral_pass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electoral_db}

# Pool de conexiones (Agroal). El default de Quarkus es 20 conexiones, que bajo el
# pico del escrutinio deja a los usuarios esperando en cola: la conexion se pide
# por request y se libera al terminar, pero con mas concurrencia que conexiones la
# espera se suma a cada latencia.
#
# 50 es el tamano del SDD de performance (T-PERF-OPT-01 D.2). Va por variable de
# entorno porque el techo real lo pone la base: Neon serverless limita las
# conexiones directas por rama, y si el plan cambia el valor se ajusta sin tocar
# el codigo. Con 1 replica en Railway, 50 es el total del proceso.
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:10}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:50}
quarkus.datasource.jdbc.acquisition-timeout=${DB_POOL_ACQUISITION_TIMEOUT:30s}
quarkus.datasource.jdbc.idle-removal-interval=5m
quarkus.datasource.jdbc.max-lifetime=30m
# Métricas del pool (T-PERF-OPT-01 D.2): conexiones activas, inactivas, en espera y
# total. Sin esto no se puede afirmar el "pool al 60-80%" que pide el SDD: el
# export de Prometheus solo traia lo de HTTP y de caché. La propiedad es de TIEMPO
# DE BUILD (quarkus-agroal la lee en build), asi que cambiarla exige reconstruir la
# imagen, no solo reiniciar el proceso.
#
# Son DOS claves: la global `quarkus.datasource.metrics.enabled` prende el
# bloque de metricas del datasource, y la `jdbc` de abajo dice que este datasource
# (el default) las publica. Con solo una de las dos no aparece nada en /q/metrics.
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.metrics.enabled=true

# ─── Liquibase ───────────────────────────────────────────────────────────────
# El changelog vive en src/main/resources/database: este módulo es su único
# dueño. Durante el strangler el archivo se copiaba desde el backend Spring, que
# era el que migraba; ahora que la implementación es una sola, la migración queda
# en ON por defecto. Ver README.md para el arranque en dos fases contra una base
# vacía (Liquibase crea el schema, Hibernate valida después).
quarkus.liquibase.migrate-at-start=${QUARKUS_LIQUIDASE_MIGRATE_AT_START:true}
quarkus.liquibase.change-log=database/db.changelog-master.yaml
# Credenciales con las que corre la MIGRACION. Son distintas de las del runtime
# (DB_USER / DB_PASSWORD) porque son dos roles distintos: la migracion necesita
# el dueno de la base (el unico que puede crear el schema) y la aplicacion
# necesita un rol que NO pueda saltarse las politicas de RLS.
#
# Si no se fijan, la migracion usa las mismas credenciales que la aplicacion:
# asi el comportamiento por defecto no cambia, y cada entorno declara el
# reparto explicito.
quarkus.liquibase.username=${QUARKUS_LIQUIBASE_USERNAME:${DB_USER:electoral_user}}
quarkus.liquibase.password=${QUARKUS_LIQUIBASE_PASSWORD:${DB_PASSWORD:electoral_pass}}
# Modo "migrate-only": el proceso aplica las migraciones y sale con codigo 0.
# Lo usa el servicio de migracion de compose y el initContainer de k8s, para que
# el contenedor de la API no tenga las credenciales del dueno de la base.
app.migrate-only=${APP_MIGRATE_ONLY:false}
# Contextos de Liquibase. Hay dos, y son independientes:
#
#   seed            -> los datos de referencia que el producto NECESITA en
#                       produccion: geografia, cargos, partidos, candidatos, JRVs
#                       y las cuentas de referencia. Vive en 025-data-seed.sql.
#   bootstrap-admin -> el admin de arranque con contrasena conocida (hash de
#                       `admin12345`, versionado en el repo). Vive en
#                       026-admin-inicial.sql. Es un artefacto de DESARROLLO: en
#                       staging y produccion la cuenta se provisiona a mano.
#
# El default es `seed`: produccion corre el seed de referencia y NO crea el
# admin de arranque. El stack local y los jobs de CI que necesitan esa cuenta
# piden `seed,bootstrap-admin` explicitamente.
#
# "schema-only" deja fuera los dos (es lo que usa la suite de tests, que
# construye su propia geografia).
#
# Trampa verificada contra la API de Liquibase 5.0.3: una lista de contextos
# VACIA no excluye nada — `ContextExpression.matches()` devuelve true para
# cualquier contexto cuando `Contexts` esta vacio. `QUARKUS_LIQUIDASE_CONTEXTS=`
# corre TODO. Para excluir, la lista tiene que ser no vacia.
quarkus.liquibase.contexts=${QUARKUS_LIQUIDASE_CONTEXTS:seed}
# validate-on-migrate off: el DATABASECHANGELOG de los ambientes existentes lo
# escribio el cliente Liquibase del backend Spring (5.0.3), no este. Encender la
# validacion en el mismo PR que cambia el runtime-turned es pedirle a produccion
# que verifique checksums contra un cliente que nunca los escribio: si no
# coinciden, la app no arranca y el corte se ve como una caida. Cuando el schema
# se haya re-baselined por Quarkus, esto se enciende en un PR propio.
quarkus.liquibase.validate-on-migrate=${QUARKUS_LIQUIDASE_VALIDATE_ON_MIGRATE:false}

# ─── Hibernate ORM ───────────────────────────────────────────────────────────
# Igual que el backend Spring: Liquibase crea el schema, Hibernate solo valida.
#
# El nombre fisico de cada columna va EXPLICITO en las entidades (@Column(name=...)).
# Spring usa CamelCaseToUnderscores y Quarkus no aplica ninguna conversion por
# defecto, asi que dejarlo a la convencion implicita hacia que las dos
# implementaciones no mapeen el mismo schema. Declararlo en cada campo hace que
# el mapeo no dependa de ninguna convencion.
# Igual que el backend Spring (ddl-auto=validate): el schema tiene que coincidir o la
# app no arranca. Con `none` lo deja crear Liquibase sin validarlo, que es lo que hay
# que usar la PRIMERA vez contra una base vacia (Liquibase corre despues de la
# validacion de Hibernate, asi que con `validate` la base vacia revienta).
quarkus.hibernate-orm.database.generation=${QUARKUS_HIBERNATE_GENERATION:validate}
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_LOG_SQL:false}
quarkus.hibernate-orm.jdbc.timezone=UTC

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Mismos nombres de variable que el backend Spring. El token se firma con Nimbus
# igual que allá, así que es byte-compatible entre las dos implementaciones.
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-in-prod-32chars-min-jwt-hmac-key}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:7d}
app.jwt.issuer=${APP_JWT_ISSUER:control-elector}
app.jwt.refresh-pepper=${APP_JWT_REFRESH_PEPPER:dev-only-control-elector-refresh-pepper}
# Vigencia del token de activacion de las invitaciones (T-AUTH-INV-01). El spec
# fija 24 horas: es tiempo de sobra para que el observador lea el email y elija
# su contrasena, y corto para que un link olvidado no sirva indefinidamente.
app.jwt.activation-ttl=${APP_JWT_ACTIVATION_TTL:24h}

# ─── Email / invitaciones ─────────────────────────────────────────────────────
# Proveedor de email. La decision D7 del design deja el proveedor intercambiable:
# el bean SMTP solo existe si esta propiedad vale "smtp", y cambiar el valor
# cambia la implementacion sin tocar la logica de invitacion.
app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.email.from=${MAIL_FROM:controlsoporte@mail.twintailcs.xyz}
# URL publica del frontend. Es la base del link de activacion que viaja en el
# email: si aponta al lugar equivocado, el link lleva a una pagina rota.
app.public.frontend-url=${APP_PUBLIC_FRONTEND_URL:http://localhost:4200}

# SMTP. Las credenciales salen del entorno; en el repositorio no hay ninguna.
# Los defaults apuntan a un servidor local sin autenticacion, que es lo que hay
# en desarrollo (MailHog / Mailpit). En staging y produccion se sobreescriben.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
# STARTTLS apagado por defecto: en desarrollo el servidor local no lo habla, y
# con STARTTLS activado el cliente exige el handshake y falla el envio.
# Ojo: la propiedad es un enum (DISABLED | OPTIONAL | REQUIRED), no un booleano.
quarkus.mailer.start-tls=${SMTP_STARTTLS:DISABLED}
# Si el SMTP no responde, no colgamos el worker de la cola.
quarkus.mailer.timeout=${SMTP_TIMEOUT:10000}

# Resend. Se activa cuando APP_EMAIL_PROVIDER=resend. Requiere:
# - Variable de entorno RESEND_API_KEY con la API key de Resend
# - DNS CNAME propagado: send.mail -> send.forge.rmta.net
# La cola de reintentos y rate limiting aplican igual que con SMTP.
# Resend API key (solo si APP_EMAIL_PROVIDER=resend):
# RESEND_API_KEY=${RESEND_API_KEY}

# Cola de email. La cola vive en memoria del proceso: los envios pendientes se
# pierden si el proceso muere, y por eso el flujo deja registro de cada intento
# y el MASTER puede reenviar a mano (decision D5 del design).
app.email.queue.batch-size=${APP_EMAIL_QUEUE_BATCH_SIZE:10}
app.email.queue.poll-interval-ms=${APP_EMAIL_QUEUE_POLL_INTERVAL_MS:5000}
app.email.queue.rate-limit=${APP_EMAIL_QUEUE_RATE_LIMIT:100}
app.email.queue.rate-limit-window-seconds=${APP_EMAIL_QUEUE_RATE_LIMIT_WINDOW_SECONDS:60}
app.email.queue.capacity=${APP_EMAIL_QUEUE_CAPACITY:5000}
# Reintentos con backoff exponencial: 1 intento, 2 y 4 segundos entre intentos.
app.email.retry.max-attempts=${APP_EMAIL_RETRY_MAX_ATTEMPTS:3}
app.email.retry.initial-delay-ms=${APP_EMAIL_RETRY_INITIAL_DELAY_MS:1000}
app.email.retry.backoff-multiplier=${APP_EMAIL_RETRY_BACKOFF_MULTIPLIER:2}

# Plantillas HTML del email: van incluidas en la imagen nativa de forma
# explicita, porque se leen del classpath en runtime.
quarkus.native.resources.includes=email/**

# ─── OpenAPI ─────────────────────────────────────────────────────────────────
# Mismo path que el backend Spring para que el spec se pueda diffear.
quarkus.smallrye-openapi.info-title=Control's Elector API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/v3/api-docs
quarkus.swagger-ui.always-include=true

# ─── Log ─────────────────────────────────────────────────────────────────────
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."ec.twintailcs.electoral".level=${APP_LOG_LEVEL:INFO}

# ─── Native ──────────────────────────────────────────────────────────────────
# El arranque en nativo es lo que motiva la migracion (ver issue #113).
#
# PENDIENTE (fase 2, issue #114): el build nativo del backend COMPLETO todavia
# no cierra. El OpenPDF referencia FopGlyphProcessor, que a su vez referencia
# org.apache.fop.complexscripts.util.GlyphSequence, de la dependencia opcional
# de FOP. Sin FOP en el classpath el build falla con "Discovered unresolved
# type during parsing: org.apache.fop.complexscripts.util.GlyphSequence".
# Con FOP aparece detras la cadena de commons-logging (Log4JLogger ->
# LogFactoryImpl -> org.apache.log4j.Priority) y el build sigue sin cerrar.
# Las tres salidas posibles estan en la issue #114.
#
# NTLMEngineImpl (del cliente HTTP de Apache que usa el AWS SDK v2) crea un
# SecureRandom en el inicializador de clase. Graal lo hornea en el heap de la
# imagen con la semilla cacheada, y ahi no se comporta como se espera: el
# build falla con "Detected an instance of Random/SplittableRandom class in the
# image heap". Inicializar esa clase en tiempo de ejecucion lo evita.
#
# Lo mismo con UsuarioAdminService: tiene un SecureRandom estatico (para generar
# la password temporal) que Graal hornea con la semilla cacheada. La clase se
# inicializa en runtime y el SecureRandom se crea de verdad en cada arranque.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.http.impl.auth.NTLMEngineImpl,--initialize-at-run-time=ec.twintailcs.electoral.auth.application.UsuarioAdminService

# ─── Sentry ──────────────────────────────────────────────────────────────────
# Error tracking y crash reporting.
#
# NO hay claves `quarkus.sentry.*` a proposito: la extension `io.quarkus:quarkus-sentry`
# NO esta en el BOM de la plataforma 3.40.1 (ver el comentario del Sentry en pom.xml).
# Escribir esas claves hacia que Quarkus las reportara como "Unrecognized configuration
# key" en cada build, sin ningun efecto: la extension que las leeria no existe.
#
# El SDK suelto (`io.sentry:sentry`) lee su configuracion del propio SDK, no de
# MicroProfile Config. Si se agrega la inicializacion del SDK, sus variables van
# como SENTRY_DSN / SENTRY_ENVIRONMENT / SENTRY_SAMPLE_RATE, no como claves quarkus.*.

# ─── Rate Limiting ────────────────────────────────────────────────────────────
# Contadores de ventana fija en Redis, compartidos entre replicas. Cada politica:
#   limit      maximo de operaciones en la ventana
#   window     duracion de la ventana (30s, 5m, 1h)
#   key        ip | user | custom (custom = identidad que arma el caso de uso)
#   on-failure local-fallback | allow   (que hacer si Redis falla o excede el timeout)
# Ninguna politica bloquea por falla de Redis: local-fallback cuenta en memoria de la
# replica (proteccion aproximada), allow deja pasar. Los limites de produccion se
# ajustan por variable de entorno en Railway sin recompilar.
# Las politicas con key=ip solo se aplican si la IP del cliente es confiable.
app.ratelimit.backend-timeout=${APP_RATELIMIT_BACKEND_TIMEOUT:50ms}
# En tests Redis corre en Testcontainers (latencia variable en Windows/CI): un timeout
# holgado evita decisiones degradadas que ensucien los IT de atomicidad. El fallback
# por timeout se prueba en ResilientRateLimiterTest.
%test.app.ratelimit.backend-timeout=2s
app.ratelimit.local-max-entries=${APP_RATELIMIT_LOCAL_MAX_ENTRIES:10000}

# Login: intentos FALLIDOS por cuenta desde una IP. Frena adivinar contrasenas sin que
# un atacante pueda bloquear al observador real (que entra desde otra IP).
app.ratelimit.policies.login-account-ip.limit=${APP_RATELIMIT_LOGIN_ACCOUNT_IP_LIMIT:5}
app.ratelimit.policies.login-account-ip.window=${APP_RATELIMIT_LOGIN_ACCOUNT_IP_WINDOW:5m}
app.ratelimit.policies.login-account-ip.key=custom
app.ratelimit.policies.login-account-ip.on-failure=local-fallback
# Login: intentos FALLIDOS por cuenta desde cualquier IP. Alto a proposito: frena un
# ataque distribuido contra una cuenta, pero hace falta mucho volumen para bloquearla.
app.ratelimit.policies.login-account.limit=${APP_RATELIMIT_LOGIN_ACCOUNT_LIMIT:30}
app.ratelimit.policies.login-account.window=${APP_RATELIMIT_LOGIN_ACCOUNT_WINDOW:15m}
app.ratelimit.policies.login-account.key=custom
app.ratelimit.policies.login-account.on-failure=local-fallback
# Login: intentos por IP. Holgado porque un recinto entero comparte IP (NAT).
app.ratelimit.policies.login-ip.limit=${APP_RATELIMIT_LOGIN_IP_LIMIT:100}
app.ratelimit.policies.login-ip.window=${APP_RATELIMIT_LOGIN_IP_WINDOW:5m}
app.ratelimit.policies.login-ip.key=ip
app.ratelimit.policies.login-ip.on-failure=local-fallback
# Reautenticacion con contrasena (cambio de email personal).
app.ratelimit.policies.reauth.limit=${APP_RATELIMIT_REAUTH_LIMIT:5}
app.ratelimit.policies.reauth.window=${APP_RATELIMIT_REAUTH_WINDOW:15m}
app.ratelimit.policies.reauth.key=user
app.ratelimit.policies.reauth.on-failure=local-fallback
# Formulario publico del DPO (anti spam).
app.ratelimit.policies.contact-dpo.limit=${APP_RATELIMIT_CONTACT_DPO_LIMIT:1}
app.ratelimit.policies.contact-dpo.window=${APP_RATELIMIT_CONTACT_DPO_WINDOW:30s}
app.ratelimit.policies.contact-dpo.key=ip
app.ratelimit.policies.contact-dpo.on-failure=local-fallback
# Observador: JRVs y cargos de una JRV.
app.ratelimit.policies.observer-jrvs.limit=${APP_RATELIMIT_OBSERVER_JRVS_LIMIT:60}
app.ratelimit.policies.observer-jrvs.window=${APP_RATELIMIT_OBSERVER_JRVS_WINDOW:1m}
app.ratelimit.policies.observer-jrvs.key=user
app.ratelimit.policies.observer-jrvs.on-failure=allow
# Observador: registro de actas. Cubre la rafaga de la cola offline al reconectar
# (cargos x reintentos). El envio es idempotente por jrv_id + cargo_id.
app.ratelimit.policies.observer-actas.limit=${APP_RATELIMIT_OBSERVER_ACTAS_LIMIT:50}
app.ratelimit.policies.observer-actas.window=${APP_RATELIMIT_OBSERVER_ACTAS_WINDOW:1m}
app.ratelimit.policies.observer-actas.key=user
app.ratelimit.policies.observer-actas.on-failure=local-fallback
# Lectura de catalogos (cargos, partidos, candidatos).
app.ratelimit.policies.config-read.limit=${APP_RATELIMIT_CONFIG_READ_LIMIT:120}
app.ratelimit.policies.config-read.window=${APP_RATELIMIT_CONFIG_READ_WINDOW:1m}
app.ratelimit.policies.config-read.key=user
app.ratelimit.policies.config-read.on-failure=allow
# Listado de usuarios (administracion).
app.ratelimit.policies.admin-usuarios.limit=${APP_RATELIMIT_ADMIN_USUARIOS_LIMIT:60}
app.ratelimit.policies.admin-usuarios.window=${APP_RATELIMIT_ADMIN_USUARIOS_WINDOW:1m}
app.ratelimit.policies.admin-usuarios.key=user
app.ratelimit.policies.admin-usuarios.on-failure=allow
# Red de seguridad para todo endpoint autenticado: corta un cliente con un bucle de
# polling. Un observador real usa 10-50 req/min.
app.ratelimit.policies.user-global.limit=${APP_RATELIMIT_USER_GLOBAL_LIMIT:1000}
app.ratelimit.policies.user-global.window=${APP_RATELIMIT_USER_GLOBAL_WINDOW:1m}
app.ratelimit.policies.user-global.key=user
app.ratelimit.policies.user-global.on-failure=allow

# ─── IP del cliente ──────────────────────────────────────────────────────────
# Produccion: la API esta detras del proxy de Cloudflare. La IP real llega en
# CF-Connecting-IP y solo se cree si el request trae el header secreto que agrega una
# Transform Rule de Cloudflare (X-Origin-Auth). Sin secreto configurado, ninguna IP es
# confiable: las politicas por IP no se aplican y la auditoria usa la IP de conexion.
# Nunca se usa X-Forwarded-For: su primer valor lo escribe el cliente.
app.client-ip.origin-secret=${APP_ORIGIN_AUTH_SECRET:}
app.client-ip.origin-secret-header=${APP_ORIGIN_AUTH_HEADER:X-Origin-Auth}
app.client-ip.client-ip-header=${APP_CLIENT_IP_HEADER:CF-Connecting-IP}
app.client-ip.trust-remote-address=false
# Desarrollo local: no hay proxy delante, la IP de conexion es la del cliente.
%dev.app.client-ip.trust-remote-address=true
# Tests: mismo mecanismo que produccion (secreto + CF-Connecting-IP), con un secreto de
# prueba. Ver shared/testing/ClientIpHeaders.
%test.app.client-ip.origin-secret=test-origin-secret

# ─── Redis (rate limiting distribuido) ───────────────────────────────────────
# En produccion apunta al Redis de la red privada de Railway. Configurar en Redis
# maxmemory-policy=volatile-ttl: todas las claves rl:* tienen TTL.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.client-type=standalone
# Pool por replica. Con los defaults de Quarkus (6 conexiones, 24 en espera) un pico de
# requests concurrentes desborda la cola: esos chequeos fallan y caen al fallback local,
# que cuenta aparte de Redis y deja pasar de mas (medido: 20 permitidos con limite 10
# bajo 50 requests simultaneos). 16 conexiones x 3 replicas = 48 clientes en Redis.
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:16}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:256}
# Redis no forma parte de la salud del producto: si cae, el rate limiting degrada al
# fallback local y la API sigue sirviendo. Que el readiness dependa de Redis sacaria
# todas las replicas de servicio por una falla que el sistema ya tolera.
quarkus.redis.health.enabled=false

# ─── Cache (T-CACHE-STRAT-01 D: Backend caching) ──────────────────────────────
# Caching backend services para datos estáticos (cargos, partidos, geografia).
# Cache EN MEMORIA del proceso (Caffeine). Decisión D2 del SDD, tomada con el
# despliegue real en Railway (1 réplica) + Neon: una caché compartida (Redis)
# solo se justifica si hay varias réplicas, y su coste no compensa aquí.
#
# TTL corto (2 min) a propósito: acota la ventana de dato viejo si algún día
# el backend corre en más de una réplica (Railway reparte el tráfico al azar y
# no hay sticky sessions, así que una réplica no ve la invalidación que hizo la
# otra). Cuesta casi nada: un refill son 4 consultas cada 2 minutos.
# CACHE_TTL lo ajusta por entorno sin tocar el código.
#
# QUARKUS_CACHE_ENABLED=false apaga la extensión de caché completa: es el knob
# para medir la línea base sin caché (el load test corre el mismo escenario con
# y sin él). OJO: en Quarkus esta propiedad se fija en tiempo de build, así que
# para cambiarla hay que reconstruir la imagen, no basta con la variable de
# entorno en un pod ya hecho.
quarkus.cache.enabled=${QUARKUS_CACHE_ENABLED:true}
quarkus.cache.caffeine.cargos.expire-after-write=${CACHE_TTL:2m}
quarkus.cache.caffeine.partidos.expire-after-write=${CACHE_TTL:2m}
quarkus.cache.caffeine.candidatos.expire-after-write=${CACHE_TTL:2m}
quarkus.cache.caffeine.geografia.expire-after-write=${CACHE_TTL:2m}

# Métricas estándar de Caffeine por caché (entradas, evictions, acierto/fallo):
# dan el tamaño de la caché, que es lo que hay que alertar cuando la memoria
# del proceso se come (F.6). Se publican en /q/metrics.
quarkus.cache.caffeine.cargos.metrics-enabled=true
quarkus.cache.caffeine.partidos.metrics-enabled=true
quarkus.cache.caffeine.candidatos.metrics-enabled=true
quarkus.cache.caffeine.geografia.metrics-enabled=true

# Identificador de la réplica que atiende la petición. Railway lo inyecta por
# réplica (RAILWAY_REPLICA_ID); en local no existe y queda "local". Va como
# etiqueta en los contadores de caché: Railway AGREGA las métricas de todas sus
# réplicas, así que sin esta etiqueta no se puede ver si una réplica quedó con
# la caché desfasada respecto de las otras.
replica.id=${RAILWAY_REPLICA_ID:local}

# Métricas (T-CACHE-STRAT-01 D.5). Sin micrometer en el classpath el hit ratio
# es una opinion: los contadores cache.hits / cache.misses los publica el
# helper CacheDeLectura. Endpoint: /q/metrics (formato Prometheus).
quarkus.micrometer.enabled=${QUARKUS_MICROMETER_ENABLED:true}
quarkus.micrometer.export.prometheus.enabled=${QUARKUS_MICROMETER_PROMETHEUS_ENABLED:true}
quarkus.micrometer.binder.http-server.enabled=true

# ─── S3 / R2 Storage (Cloudflare R2) ───────────────────────────────────────────
# Almacenamiento de objetos para evidencias de actas. Usa Cloudflare R2 en producción
# (S3-compatible) y MinIO/RustFS en desarrollo.
#
# Credenciales: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (ej. en k8s secrets).
# Defaults: credenciales locales de RustFS.
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.s3.region=${AWS_S3_REGION:auto}
aws.s3.bucket=${AWS_S3_BUCKET:electoral-evidences}
aws.access.key.id=${AWS_ACCESS_KEY_ID:rustfsadmin}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:rustfsadmin123}
aws.s3.force-path-style=${AWS_S3_PATH_STYLE:true}

# Duración de URLs prefirmadas (upload/download). RF-STG-04.
app.s3.presign-expiry=${APP_S3_PRESIGN_EXPIRY:PT15M}
