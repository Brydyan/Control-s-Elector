<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuenta activada — Control Electoral</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f6f8;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2933;
      }
      .container {
        max-width: 600px;
        margin: 24px auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 8px;
        border: 1px solid #e4e7eb;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
        color: #14532d;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.5;
        font-size: 15px;
      }
      .ok {
        display: inline-block;
        margin-bottom: 16px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #16a34a;
        color: #ffffff;
        font-size: 24px;
        line-height: 44px;
        text-align: center;
      }
      .button {
        display: inline-block;
        margin: 8px 0 20px;
        padding: 14px 28px;
        background: #1d4ed8;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 6px;
      }
      .footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid #e4e7eb;
        font-size: 12px;
        color: #616e7c;
      }
      @media (max-width: 480px) {
        .container {
          margin: 0;
          padding: 20px;
          border-radius: 0;
        }
        .button {
          display: block;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="ok">&#10003;</div>
      <h1>¡Cuenta activada!</h1>
      <p>Hola <strong>{{nombreCompleto}}</strong>, tu cuenta ya está activa.</p>
      <p>Ya podés iniciar sesión con tu correo y la contraseña que elegiste.</p>
      <p style="text-align: center">
        <a href="/login" class="button">Ir a iniciar sesión</a>
      </p>
      <div class="footer">
        <p style="margin: 0">
          © 2026 Control Electoral — CNE Ecuador. Este mensaje es automático, no respondas a este
          correo.
        </p>
      </div>
    </div>
  </body>
</html>
