  # El seed de datos de referencia va al FINAL, no por número de archivo sino por
  # orden de ejecución. Escribes para un punto del esquema en el que aun existia
  # `acta.storage_url` (columna que dropea 019) y sobre `usuario.public_id`, que
  # 004 dejo NOT NULL sin default. Correlo antes de un 016/019 te rompe las bases
  # ya migradas; correrlo al final funciona igual en bases nuevas y existentes.
  - include: { file: database/changelog/025-00-usuario-public-id-default.sql }
  - include: { file: database/changelog/025-data-seed.sql }
  # El admin inicial va al final: necesita `rol` con nombre MASTER, que crea el
  # seed de RBAC. Lleva `context: bootstrap-admin` explicito —propio, no el del
  # seed de referencia— para que produccion pueda correr los datos de
  # referencia sin crear esta cuenta, que tiene una contrasena conocida y
  # versionada. Ver el aviso de seguridad en el archivo.
  - include: { file: database/changelog/026-admin-inicial.sql }
  # Repara el hash de las cuentas de referencia del 025, que se creo con un
  # placeholder de 61 caracteres en vez de un BCrypt de 60 y por lo tanto no
  # dejaba iniciar sesion. Va aparte porque un changeset corre una sola vez:
  # editar el 025 arregla bases nuevas, no las ya migradas.
  - include: { file: database/changelog/027-repara-hash-cuentas-referencia.sql }
  # Cumplimiento legal (T-LEGAL-01): aceptación de términos y política de privacidad,
  # solicitudes al DPO, auditoría de exportaciones de datos. Va al final porque solo
  # ALTERea `usuario` y crea tablas nuevas con RLS.
  - include: { file: database/changelog/030-legal-compliance.sql }
  # Invitaciones de usuario por email (T-AUTH-INV-01): estado de activacion,
  # hash del token de activacion y marcas de tiempo. Va al final porque solo
  # ALTERea `usuario` y no depende del orden de ninguna otra tabla.
  - include: { file: database/changelog/028-invitaciones.sql }
  # Invitaciones con email personal (T-AUTH-INV-02): el correo de contacto de
  # la persona invitada y la auditoria de cada invitacion (quien invita, desde
  # que IP, cuando expira). Va al final porque solo ALTERea `usuario` y crea una
  # tabla nueva, sin depender del orden de ninguna otra.
  - include: { file: database/changelog/029-user-invitations.sql }
  # Derecho al olvido (T-COMPLIANCE-04): campos para soft-delete (30 días) y
  # hard-delete automático (cron job). Incluye tabla de auditoría para GDPR.
  - include: { file: database/changelog/031-usuario-deletion-fields.sql }
  - include: { file: database/changelog/032-deletion-audit.sql }
  # Invitaciones con 24 horas de vigencia (ODD #504 B): actualiza el default
  # y la data existente. Va aquí porque modifica user_invitations (creada en 029).
  - include: { file: database/changelog/033-user-invitation-24h-expiry.sql }
  # K6 load test users: 14 OBSERVERs, 5 COORDINATORs, 1 ADMIN
  # Contexto seed: solo en dev local, no en tests o producción
  - include: { file: database/changelog/034-k6-load-test-users.sql }
  # Configuración geográfica jerárquica (SDD 2026-11-16-config-geografica): permiso
  # `configuracion:read` para MASTER y ADMIN, y el submenú de MASTER para la pantalla
  # de geografía. Solo crea permisos y menús: no toca la estructura de las tablas.
  - include: { file: database/changelog/035-config-geografica.sql }
  # Rol de aplicación (ODD rls-app-role): permisos del rol `electoral_app` y
  # funciones de RLS como SECURITY DEFINER. Va al final porque concede
  # permisos sobre TODAS las tablas: si corre antes que un changeset que crea
  # tablas, esas tablas nuevas no quedan cubiertas (por eso el mismo changeset
  # instala además ALTER DEFAULT PRIVILEGES).
  - include: { file: database/changelog/036-app-role-grants.sql }
  # Política de INSERT para `notificacion` (ODD rls-app-role): la tabla tenía RLS
  # sin política de inserción, algo que solo se nota cuando el rol de la
  # aplicación NO es superusuario. Va aparte porque 036 ya está aplicado en
  # bases migradas: editarlo cambiaría su checksum.
  - include: { file: database/changelog/037-notificacion-insert-policy.sql }
  # Políticas de UPDATE y DELETE para `evidencia` (ODD rls-app-role): la tabla
  # tenía RLS sin políticas para esos dos comandos, que con RLS real significa
  # DENEGADOS (no "sin restricción").
  - include: { file: database/changelog/038-evidencia-update-delete.sql }
