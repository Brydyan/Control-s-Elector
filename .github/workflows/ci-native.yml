# =============================================================================
# Backend Native Image — workflow separado a proposito.
# =============================================================================
# Vive en su propio archivo, y no como job de `ci.yml`, por una razon de costo:
# el build nativo tarda ~19 minutos y es el 65% del computo de cada corrida de
# CI. Corria en TODOS los PRs, incluso los que solo tocan el frontend o la
# documentacion, donde no puede cambiar el resultado.
#
# Aqui el filtro `paths` hace que solo corra cuando cambia algo del modulo
# Quarkus o el workflow mismo. El job NO es un required check del ruleset de
# `develop`, asi que omitirlo no bloquea ningun PR — eso si lo pasaria, porque un
# required check que nunca reporta deja el PR esperando para siempre.
#
# Los 6 checks que SI son required (Backend Tests & Coverage, Backend Format,
# Frontend ESLint, Frontend Format Check, Frontend Production Build, Frontend
# Unit Tests) viven en `ci.yml` y no se tocan.
# =============================================================================

name: Backend Native Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/electoral-api-quarkus/**'
      - '.github/workflows/ci-native.yml'
  schedule:
    - cron: '0 3 * * *'  # Ejecución nocturna diaria a las 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-native:
    name: Backend Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8
            --locale-provider=icu
            --icu-locale=es-EC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin123123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Valkey: cache distribuida de Phase 2 y contadores del rate limiting.
      # Sin este servicio, la cache degrada a "siempre miss" en el binario nativo y
      # la asercion de cache_hits de mas abajo no probaria nada.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create the evidence bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123123 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli \
            --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket electoral-evidences

      # Builder Mandrel. `native-image-xmx=7g` acota el heap del AOT: el runner
      # estandar tiene 16 GB. 7g con AOTSingleCallsiteInline deshabilitado reduce
      # GC overhead (90.8s → pauses menores) evitando timeout en [6/8] Compiling methods.
      # Se deja que el Dockerfile.native defina los args en lugar de sobrescribirlos aqui.
      - name: Build the native image
        run: |
          docker build \
            -f backend/electoral-api-quarkus/Dockerfile.native \
            -t electoral-api-native \
            backend/electoral-api-quarkus

      - name: Report image sizes
        run: |
          docker images electoral-api-native --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
          echo "--- la imagen JVM, para comparar ---"
          docker images electoral-api:contract --format "{{.Repository}}:{{.Tag}}  {{.Size}}" || echo "(no construida en este job)"

      # Arranque en dos fases, igual que el job `backend-quarkus`: en Quarkus
      # Hibernate valida antes de que Liquibase cree el schema, asi que contra
      # una base VACIA el arranque con `validate` (el default) revienta con
      # "Schema validation: missing table [acta]".
      # El rol con el que conecta la APLICACION. Sin esto, el binario entra como
      # superusuario y Postgres ignora las politicas de RLS.
      - name: Create the application role
        run: |
          docker run --rm --network host -i \
            -e PGPASSWORD=electoral_pass \
            postgres:16 \
            psql -h localhost -U electoral_user -d electoral_db \
                 -v ON_ERROR_STOP=1 \
                 -v app_role=electoral_app \
                 -v app_password=electoral_app_pass \
                 -f - < scripts/db/create-app-role.sql

      # El rol de la aplicacion NO puede ser superusuario ni tener BYPASSRLS: con
      # cualquiera de los dos, Postgres le ignora las politicas de RLS y la suite
      # de contrato volveria a pasar sin tocar la capa que hay que probar.
      - name: Assert the application role cannot bypass RLS
        run: |
          docker run --rm --network host -e PGPASSWORD=electoral_pass \
            postgres:16 \
            psql -h localhost -U electoral_user -d electoral_db -t -A \
              -c "select rolsuper or rolbypassrls from pg_roles where rolname='electoral_app';" \
            | grep -qx 'f' || {
              echo "FALLO: el rol electoral_app no puede ser superusuario ni BYPASSRLS";
              exit 1;
            }

      # Los limites de rate limiting se relajan SOLO en este job: la suite de
      # contrato lee mas rapido que un observador real y con los limites de
      # produccion (60/min para /observer/jrvs) se come su propia cuota y falla
      # con 429. Los limites de produccion no cambian; la cobertura del 429 vive
      # en RateLimitingIT, dentro del modulo del backend.
      - name: Boot the native binary twice
        run: |
          # La primera fase migra con el DUENO de la base (el unico que puede
          # crear el schema); la segunda valida el schema contra las entidades
          # con el ROL DE APLICACION, que es como corre en produccion.
          boot_native() {
            docker run -d --name electoral-api-native --network host \
              -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=electoral_db \
              -e DB_USER="$DB_USER" -e DB_PASSWORD="$DB_PASSWORD" \
              -e SERVER_PORT=8080 \
              -e APP_JWT_SECRET=ci-only-contract-secret-at-least-32-chars \
              -e APP_JWT_REFRESH_PEPPER=ci-only-contract-pepper \
              -e QUARKUS_LIQUIBASE_CONTEXTS=seed,bootstrap-admin \
              -e AWS_ACCESS_KEY_ID=rustfsadmin \
              -e AWS_SECRET_ACCESS_KEY=rustfsadmin123123 \
              -e AWS_S3_ENDPOINT=http://localhost:9000 \
              -e AWS_S3_REGION=us-east-1 \
              -e AWS_S3_BUCKET=electoral-evidences \
              -e AWS_S3_PATH_STYLE=true \
              -e APP_RATELIMIT_OBSERVER_JRVS_LIMIT=100000 \
              -e APP_RATELIMIT_OBSERVER_ACTAS_LIMIT=100000 \
              -e APP_RATELIMIT_CONFIG_READ_LIMIT=100000 \
              -e APP_RATELIMIT_ADMIN_USUARIOS_LIMIT=100000 \
              -e APP_RATELIMIT_USER_GLOBAL_LIMIT=1000000 \
              -e APP_RATELIMIT_LOGIN_IP_LIMIT=100000 \
              -e APP_RATELIMIT_LOGIN_ACCOUNT_LIMIT=100000 \
              -e APP_RATELIMIT_LOGIN_ACCOUNT_IP_LIMIT=100000 \
              -e APP_RATELIMIT_REAUTH_LIMIT=100000 \
              -e APP_RATELIMIT_CONTACT_DPO_LIMIT=100000 \
              "$@" electoral-api-native
          }

          # Primera fase: crea el schema. El cronometro arranca con el contenedor,
          # asi que mide el cold start real (proceso + init + Liquibase).
          echo "Arrancando el binario nativo contra la base vacia..."
          START=$(date +%s%N)
          DB_USER=electoral_user DB_PASSWORD=electoral_pass \
            boot_native -e QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=none
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/actuator/health >/dev/null || {
            echo "El binario nativo no llego a estar saludable"
            docker logs electoral-api-native; exit 1;
          }
          END=$(date +%s%N)
          echo "COLD START (crea el schema, base vacia): $(( (END-START)/1000000 )) ms"

          docker rm -f electoral-api-native

          # Segunda fase: con los defaults. El binario tiene que levantar Y
          # validar que el schema coincide con las entidades.
          echo "Arrancando de nuevo con los defaults (validate)..."
          START=$(date +%s%N)
          DB_USER=electoral_app DB_PASSWORD=electoral_app_pass \
            boot_native -e QUARKUS_LIQUIBASE_MIGRATE_AT_START=false
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/actuator/health >/dev/null || {
            echo "El binario nativo no levanto con validate"
            docker logs electoral-api-native; exit 1;
          }
          END=$(date +%s%N)
          echo "COLD START (schema ya creado): $(( (END-START)/1000000 )) ms"

      # La prueba que decide si la cache distribuida sirve DE VERDAD en el binario
      # nativo. La lectura con tipo generico (`List<Cargo>`, `GeografiaTreeDto`)
      # necesita el tipo concreto para deserializar, y eso lo resuelve el helper
      # reflejando sobre `TypeLiteral.actualType`. Esa reflexion solo funciona en
      # la imagen nativa si Quarkus registra el campo, y si deja de registrarlo la
      # cache degrada a "siempre miss" en silencio: el backend responde 200, pero
      # cada request va a la base. Ningun test de la JVM lo detectaria.
      #
      # Por eso la asercion mira el contador de aciertos, no el codigo de respuesta:
      # el codigo es 200 con y sin cache.
      - name: Assert the distributed cache serves the second read
        run: |
          set -euo pipefail

          # Credenciales del admin de CI: solo para testing en esta pipeline. Estas no son
          # credenciales de produccion ni de desarrollo. Son el hash conocido que genera
          # Liquibase en el contexto bootstrap-admin (026-admin-inicial.sql).
          # IMPORTANTE: si Liquibase se reejcuta contra una base existente con estas
          # credenciales, el CHANGE ID debe bumpear para que la migracion no se salte.
          # Ver documents/CACHE_SETUP_GUIDE.md §4 para la rotacion de credenciales en prod.
          TOKEN=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@control-elector.local","password":"admin12345"}' \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "FALLO: no se pudo iniciar sesion como MASTER"
            docker logs electoral-api-native
            exit 1
          fi

          # Dos lecturas: la primera llena la cache, la segunda tiene que servirse de ella.
          for _ in 1 2; do
            curl -sf -H "Authorization: Bearer $TOKEN" \
              http://localhost:8080/api/v1/configuracion/partidos > /dev/null
          done

          HITS=$(curl -s http://localhost:8080/q/metrics \
            | grep -E '^cache_hits_total\{cache="partidos"' \
            | head -1 | awk '{print $2}')
          echo "cache_hits_total{cache=partidos} = ${HITS:-0}"

          if ! awk -v h="${HITS:-0}" 'BEGIN { exit !(h >= 1) }'; then
            echo "FALLO: la cache distribuida no registro ni un acierto en el binario nativo."
            echo "La deserializacion generica en native image esta rota: la cache degrada a 'siempre miss'."
            docker logs electoral-api-native
            exit 1
          fi

      - name: Measure resident memory at rest
        run: |
          PID=$(docker inspect -f '{{.State.Pid}}' electoral-api-native)
          RSS_KB=$(awk '/VmRSS/ {print $2}' /proc/$PID/status)
          echo "RSS EN REPOSO: $(( RSS_KB / 1024 )) MB"

      # La prueba que importa: el binario nativo tiene que cumplir el MISMO
      # contrato que la imagen JVM, incluido el PDF del expediente. El artefacto
      # de la suite es el mismo; lo unico que cambia es el binario de enfrente.
      - name: Run the contract suite against the native binary
        working-directory: backend/contract-tests
        run: mvn -B verify -Dcontract.baseUrl=http://localhost:8080

      - name: Native logs on failure
        if: failure()
        run: docker logs electoral-api-native

  # ===========================================================================
  # FRONTEND JOBS (Separados: format, lint, test, build)
  # ===========================================================================
