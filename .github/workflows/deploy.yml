name: CD - Build & Push Docker Images

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-cd]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/electoral-api-quarkus
          file: ./backend/electoral-api-quarkus/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/app
          file: ./frontend/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
