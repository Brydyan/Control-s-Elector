name: CD - Build & Push Docker Images

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-cd]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/electoral-api-quarkus
          file: ./backend/electoral-api-quarkus/Dockerfile.native
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/app
          file: ./frontend/app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/control-electoral-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s-staging
    runs-on: [self-hosted, twintailserver]
    needs: build-and-push
    if: "!contains(github.event.head_commit.message, '[skip-cd]')"

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.119.184.75 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to k3s-staging
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@100.119.184.75 << 'EOF'
          kubectl set image deployment/electoral-api -n control-electoral electoral-api=${{ secrets.DOCKER_USERNAME }}/control-electoral-backend:latest
          kubectl set image deployment/electoral-frontend -n control-electoral electoral-frontend=${{ secrets.DOCKER_USERNAME }}/control-electoral-frontend:latest
          kubectl rollout status deployment/electoral-api -n control-electoral
          kubectl rollout status deployment/electoral-frontend -n control-electoral
          EOF
