name: CD - Deploy to Staging (SSH)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to staging server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=no brydyan@twintailserver \
            'cd /mnt/storage/projects/controls_elector/data && git pull origin develop && docker-compose up -d'
