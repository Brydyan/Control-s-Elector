name: CD - Despliegue Automático Controls Elector (Staging)

on:
  push:
    branches:
      - develop

# Skip con label 'skip-cd' en el commit o el PR. Útil cuando querés mergear
# a develop para que CI corra pero no deployar (ej. cambios de docs, tests,
# o cualquier cosa que no quieras en staging todavía).
jobs:
  deploy:
    name: Desplegar en Servidor Staging
    runs-on: [self-hosted, Linux]
    if: "!contains(github.event.head_commit.message, '[skip-cd]') && !contains(github.event.pull_request.labels.*.name, 'skip-cd')"

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ejecutar script de despliegue
        run: |
          if [ -f "./deploy.sh" ]; then
            chmod +x ./deploy.sh
            ./deploy.sh
          else
            echo "El script deploy.sh no se encontró en la raíz del proyecto."
            exit 1
          fi
