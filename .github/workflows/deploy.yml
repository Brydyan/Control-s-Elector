name: CD - Despliegue Automático Controls Elector (Staging)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Desplegar en Servidor Staging
    runs-on: [self-hosted, Linux]

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ejecutar script de despliegue
        run: |
          if [ -f "./deploy.sh" ]; then
            chmod +x ./deploy.sh
            ./deploy.sh
          else
            echo "El script deploy.sh no se encontró en la raíz del proyecto."
            exit 1
          fi
