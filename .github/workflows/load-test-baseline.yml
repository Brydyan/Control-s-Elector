name: Load Test Baseline (20 VUs)

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/tests/load/**'
      - '.github/workflows/load-test-baseline.yml'
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/tests/load/**'
      - '.github/workflows/load-test-baseline.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # LOAD TESTING (Baseline - 20 VUs)
  # ===========================================================================
  # Load test en cada PR: baseline 20 VUs para validar que el sistema tolera
  # carga mínima. Útil para detectar regresos de performance temprano.
  # SLA: p95 < 1.5s, p99 < 2s, failures < 2%
  load-test-baseline:
    name: Load Test Baseline (20 VUs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8
            --locale-provider=icu
            --icu-locale=es-EC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create the evidence bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli \
            --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket electoral-evidences

      - name: Build the backend image
        run: docker build -t electoral-api:load-test backend/electoral-api-quarkus

      - name: Start the backend
        run: |
          docker run -d --name electoral-api --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=electoral_db \
            -e DB_USER=electoral_user \
            -e DB_PASSWORD=electoral_pass \
            -e SERVER_PORT=8080 \
            -e APP_JWT_SECRET=ci-only-load-test-secret-at-least-32-chars \
            -e APP_JWT_REFRESH_PEPPER=ci-only-load-test-pepper \
            -e APP_SEED_ADMIN_PASSWORD=admin12345 \
            -e QUARKUS_LIQUIDASE_MIGRATE_AT_START=true \
            -e QUARKUS_HIBERNATE_GENERATION=none \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_S3_ENDPOINT=http://localhost:9000 \
            -e AWS_S3_REGION=us-east-1 \
            -e AWS_S3_BUCKET=electoral-evidences \
            -e AWS_S3_PATH_STYLE=true \
            electoral-api:load-test

      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "✅ Backend healthy"
              curl -s http://localhost:8080/actuator/health | jq .
              exit 0
            fi
            echo "Waiting for backend... ($i/90)"
            sleep 2
          done
          echo "❌ Backend did not become healthy"
          docker logs electoral-api
          exit 1

      - name: Set up Node.js (for k6)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install k6
        run: |
          K6_VERSION=$(curl -s https://api.github.com/repos/grafana/k6/releases/latest | grep tag_name | cut -d'"' -f4)
          K6_VERSION=${K6_VERSION#v}
          curl -L "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" -o k6.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v${K6_VERSION}-linux-amd64/k6 /usr/local/bin/
          rm -rf k6.tar.gz k6-v${K6_VERSION}-linux-amd64
          k6 version

      - name: Generate bcrypt hash for test password
        id: hash
        run: |
          # Asegurar que pgcrypto esté disponible (se necesita para bcrypt)
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -c \
            "CREATE EXTENSION IF NOT EXISTS pgcrypto;" || true

          # Generar hash bcrypt válido para 'SecurePass123!' usando PostgreSQL
          BCRYPT_HASH=$(PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT crypt('SecurePass123!', gen_salt('bf', 12));")

          if [ -z "$BCRYPT_HASH" ] || [ "$BCRYPT_HASH" == " " ]; then
            echo "❌ Failed to generate bcrypt hash"
            exit 1
          fi

          echo "✅ Generated bcrypt hash: ${BCRYPT_HASH:0:20}..."
          echo "hash=${BCRYPT_HASH}" >> $GITHUB_OUTPUT

      - name: Verify database schema
        run: |
          echo "🔍 Verifying Liquibase migrations..."
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;" | head -20

          TABLE_COUNT=$(PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")

          if [ "$TABLE_COUNT" -lt 5 ]; then
            echo "❌ Schema incomplete: only $TABLE_COUNT tables. Liquibase may have failed."
            echo "Backend logs:"
            docker logs electoral-api || true
            exit 1
          fi
          echo "✅ Schema verified: $TABLE_COUNT tables found"

      - name: Create seed data SQL
        run: |
          mkdir -p /tmp/seed
          HASH="${{ steps.hash.outputs.hash }}"

          cat > /tmp/seed/seed.sql << EOF
          INSERT INTO usuario (email, nombre, apellido, password_hash, rol_id, habilitado, creado_en) VALUES
            ('obs1@electoral.ec', 'Observer', '1', '$HASH', (SELECT id FROM rol WHERE nombre='OBSERVER'), true, NOW()),
            ('obs2@electoral.ec', 'Observer', '2', '$HASH', (SELECT id FROM rol WHERE nombre='OBSERVER'), true, NOW()),
            ('obs3@electoral.ec', 'Observer', '3', '$HASH', (SELECT id FROM rol WHERE nombre='OBSERVER'), true, NOW()),
            ('obs4@electoral.ec', 'Observer', '4', '$HASH', (SELECT id FROM rol WHERE nombre='OBSERVER'), true, NOW()),
            ('obs5@electoral.ec', 'Observer', '5', '$HASH', (SELECT id FROM rol WHERE nombre='OBSERVER'), true, NOW()),
            ('coord1@electoral.ec', 'Coordinator', '1', '$HASH', (SELECT id FROM rol WHERE nombre='COORDINATOR'), true, NOW()),
            ('coord2@electoral.ec', 'Coordinator', '2', '$HASH', (SELECT id FROM rol WHERE nombre='COORDINATOR'), true, NOW()),
            ('admin@electoral.ec', 'Admin', 'Electoral', '$HASH', (SELECT id FROM rol WHERE nombre='MASTER'), true, NOW())
          ON CONFLICT (email) DO NOTHING;
          EOF

          echo "📋 Seed SQL:"
          cat /tmp/seed/seed.sql

      - name: Seed test data
        run: |
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -f /tmp/seed/seed.sql || {
            echo "❌ Seed data failed"
            exit 1
          }

      - name: Verify test data
        run: |
          echo "🔍 Checking if users were created..."
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT COUNT(*) as total_users FROM usuario; SELECT u.email, r.nombre as rol FROM usuario u JOIN rol r ON u.rol_id = r.id WHERE u.email LIKE '%@electoral.ec' ORDER BY u.email;"

          USER_COUNT=$(PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT COUNT(*) FROM usuario WHERE email LIKE '%@electoral.ec';")

          if [ "$USER_COUNT" -lt 5 ]; then
            echo "❌ Only $USER_COUNT test users created (expected at least 5)"
            exit 1
          fi
          echo "✅ $USER_COUNT test users created successfully"

      - name: Run k6 baseline test (20 VUs, 5 min)
        run: |
          cd frontend/tests/load
          mkdir -p results
          k6 run scenarios/login.js \
            --vus 20 \
            --duration 5m \
            --out json=results/baseline-pr-${GITHUB_RUN_ID}.json \
            -e API_HOST=localhost:8080
        env:
          K6_VUS: "20"
          K6_DURATION: "5m"

      - name: Extract and validate metrics
        run: |
          # Parse k6 results y validar SLAs
          RESULTS_FILE="frontend/tests/load/results/baseline-pr-${GITHUB_RUN_ID}.json"

          # Extract key metrics
          P95=$(jq -r '.metrics.http_req_duration.values.p95 // 0' "$RESULTS_FILE" | tr ',' '.')
          P99=$(jq -r '.metrics.http_req_duration.values.p99 // 0' "$RESULTS_FILE" | tr ',' '.')
          FAILURES=$(jq -r '.metrics.http_req_failed.values.rate // 0' "$RESULTS_FILE")

          echo "📊 Load Test Results (20 VUs, 5 min)"
          echo "======================================"
          echo "p95 latency: ${P95}ms (threshold: 1500ms)"
          echo "p99 latency: ${P99}ms (threshold: 2000ms)"
          echo "Failure rate: ${FAILURES}% (threshold: 2%)"
          echo ""

          # Convert to numeric for comparison
          P95_NUM=$(echo "$P95" | cut -d'.' -f1)
          P99_NUM=$(echo "$P99" | cut -d'.' -f1)

          if [ "$P95_NUM" -gt 1500 ]; then
            echo "❌ FAILED: p95 exceeds 1500ms"
            exit 1
          fi

          if [ "$P99_NUM" -gt 2000 ]; then
            echo "❌ FAILED: p99 exceeds 2000ms"
            exit 1
          fi

          echo "✅ Load test PASSED all SLAs"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-baseline-results-${{ github.run_id }}
          path: frontend/tests/load/results/
          retention-days: 30

      - name: Collect backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs electoral-api || true
          echo ""
          echo "=== K6 Results ==="
          cat frontend/tests/load/results/baseline-pr-*.json | jq '.metrics' | head -100
