name: Integration & Contracts

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/integration-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # BACKEND CONTRACT & INTEGRATION TESTS (Quality Gate 2)
  # ===========================================================================
  # Suite de integración y contratos que verifica el ensamble del backend
  # contra Postgres 16, Valkey 8 y almacenamiento de evidencias (RustFS S3).
  # Se ejecuta automáticamente al integrar en develop y main, o manualmente
  # vía workflow_dispatch.
  backend-contract:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8
            --locale-provider=icu
            --icu-locale=es-EC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create the evidence bucket
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin123
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_REGION: us-east-1
        run: |
          python3 -c "
          import urllib.request, os
          # Bucket creation against S3 API
          req = urllib.request.Request('http://localhost:9000/electoral-evidences', method='PUT')
          # Basic auth or S3 signature not strictly needed for rustfs bucket create if local
          " || true
          # Alternative CLI / curl approach if python fails
          curl -X PUT http://localhost:9000/electoral-evidences || true

      - name: Build the backend image
        run: docker build --no-cache -t electoral-api:contract backend/electoral-api-quarkus

      - name: Create the application role
        run: |
          docker run --rm --network host -e PGPASSWORD=electoral_pass postgres:16 psql \
            -h localhost -U electoral_user -d electoral_db -c "
              DO \$\$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'electoral_app') THEN
                  CREATE ROLE electoral_app WITH LOGIN PASSWORD 'electoral_app_pass' NOSUPERUSER NOBYPASSRLS;
                END IF;
              END \$\$;
            "

      - name: Assert the application role cannot bypass RLS
        run: |
          has_bypass="$(docker run --rm --network host -e PGPASSWORD=electoral_pass postgres:16 psql \
            -h localhost -U electoral_user -d electoral_db -tA -c \
            "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'electoral_app';")"
          if [ "$has_bypass" != "f" ]; then
            echo "FATAL: el rol electoral_app tiene BYPASSRLS ($has_bypass)"
            exit 1
          fi

      - name: Migrate the schema
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=electoral_db \
            -e DB_USER=electoral_user \
            -e DB_PASSWORD=electoral_pass \
            -e QUARKUS_LIQUIBASE_MIGRATE_AT_START=true \
            -e QUARKUS_LIQUIBASE_CONTEXTS=seed,bootstrap-admin \
            -e SERVER_PORT=8080 \
            -e APP_JWT_SECRET=ci-only-contract-secret-at-least-32-chars \
            -e APP_JWT_REFRESH_PEPPER=ci-only-contract-pepper \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_S3_ENDPOINT=http://localhost:9000 \
            -e AWS_S3_REGION=us-east-1 \
            -e AWS_S3_BUCKET=electoral-evidences \
            -e REDIS_HOSTS=redis://localhost:6379 \
            electoral-api:contract &
          
          sleep 10
          docker ps -a

      - name: Run the backend
        run: |
          docker run -d --name electoral-api --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=electoral_db \
            -e DB_USER=electoral_app \
            -e DB_PASSWORD=electoral_app_pass \
            -e QUARKUS_LIQUIBASE_USERNAME=electoral_user \
            -e QUARKUS_LIQUIBASE_PASSWORD=electoral_pass \
            -e QUARKUS_LIQUIBASE_MIGRATE_AT_START=false \
            -e SERVER_PORT=8080 \
            -e APP_JWT_SECRET=ci-only-contract-secret-at-least-32-chars \
            -e APP_JWT_REFRESH_PEPPER=ci-only-contract-pepper \
            -e QUARKUS_LIQUIBASE_CONTEXTS=seed,bootstrap-admin \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_S3_ENDPOINT=http://localhost:9000 \
            -e AWS_S3_REGION=us-east-1 \
            -e AWS_S3_BUCKET=electoral-evidences \
            -e AWS_S3_PATH_STYLE=true \
            -e APP_RATELIMIT_OBSERVER_JRVS_LIMIT=100000 \
            -e APP_RATELIMIT_OBSERVER_ACTAS_LIMIT=100000 \
            -e APP_RATELIMIT_CONFIG_READ_LIMIT=100000 \
            -e APP_RATELIMIT_ADMIN_USUARIOS_LIMIT=100000 \
            -e APP_RATELIMIT_USER_GLOBAL_LIMIT=1000000 \
            -e APP_RATELIMIT_LOGIN_IP_LIMIT=100000 \
            -e APP_RATELIMIT_LOGIN_ACCOUNT_LIMIT=100000 \
            -e APP_RATELIMIT_LOGIN_ACCOUNT_IP_LIMIT=100000 \
            -e APP_RATELIMIT_REAUTH_LIMIT=100000 \
            -e APP_RATELIMIT_CONTACT_DPO_LIMIT=100000 \
            -e REDIS_HOSTS=redis://localhost:6379 \
            electoral-api:contract

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend saludable"
              curl -s http://localhost:8080/actuator/health
              exit 0
            fi
            sleep 2
          done
          echo "El backend no llego a estar saludable"
          docker logs electoral-api
          exit 1

      - name: Run the contract suite
        working-directory: backend/contract-tests
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Running contract suite"
            if mvn -s ../../.maven/settings.xml -B verify -Dcontract.baseUrl=http://localhost:8080; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((2 ** attempt * 10))
              echo "Failed. Waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          exit 1

      - name: Backend logs on failure
        if: failure()
        run: docker logs electoral-api
