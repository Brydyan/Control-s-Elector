name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  # ===========================================================================
  # BACKEND JOBS
  # ===========================================================================
  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Fetch formatting baseline
        run: git fetch origin develop:refs/remotes/origin/develop || true

      - name: Check Java formatting
        working-directory: backend/electoral-api
        run: ./mvnw -B spotless:check

  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Backend
        working-directory: backend/electoral-api
        run: ./mvnw -B clean verify -Dspotless.check.skip=true

  # ===========================================================================
  # FRONTEND JOBS (Separados: format, lint, test, build)
  # ===========================================================================
  frontend-format:
    name: Frontend Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        working-directory: frontend/app
        run: pnpm format:check

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend/app
        run: pnpm lint

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests (Headless)
        working-directory: frontend/app
        run: pnpm test:ci
        continue-on-error: true

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Build Angular Application
        working-directory: frontend/app
        run: pnpm build
