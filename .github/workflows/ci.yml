name: CI

on:
  pull_request:
    # `main` y `develop` son las ramas de integracion. Los demas prefijos estan
    # porque el stack de PRs es apilado: un PR cuya base es otra rama de feature
    # (por ejemplo #152 sobre `feat/backend-quarkus-cutover`) no dispara CI si la
    # lista no lo cubre, y se queda sin checks en silencio.
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
      - 'chore/**'
      - 'build/**'
      - 'upgrade/**'
      - 'docs/**'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # BACKEND JOBS
  # ===========================================================================
  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Fetch formatting baseline
        run: git fetch origin develop:refs/remotes/origin/develop || true

      - name: Check Java formatting
        working-directory: backend/electoral-api-quarkus
        run: mvn -B spotless:check

  # El backend es UNO solo. Antes estos dos jobs eran `backend-format` (Spring)
  # y `backend-test` (Spring), y `backend-quarkus-test` corria los tests del
  # modulo Quarkus. Con el corte, `backend-quarkus-test` es el unico que
  # verifica y formatea el backend: no hay segundo modulo que testear.

  # ===========================================================================
  # BACKEND CONTRACT TESTS
  # ===========================================================================
  # Suite de regresion por contrato (backend/contract-tests). El artefacto es
  # agnosticodel framework: habla solo HTTP, asi que el mismo test que validaba
  # la paridad entre Spring y Quarkus sigue siendo valido — lo que cambio fue
  # contra quien corre. Cuando quede una sola implementacion, esta suite es el
  # gate de contrato del backend.
  backend-contract:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8
            --locale-provider=icu
            --icu-locale=es-EC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # El backend no crea el bucket: lo crea el compose en dev y aca lo
      # creamos nosotros. Sin el bucket el S3HealthIndicator queda DOWN y
      # /actuator/health devuelve 503.
      - name: Create the evidence bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli \
            --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket electoral-evidences

      - name: Build the backend image
        run: docker build -t electoral-api:contract backend/electoral-api-quarkus

      # --network host para que el contenedor alcance los services de GitHub
      # Actions por los puertos publicados en el host (5432 y 9000). Asi no
      # hay que adivinar el nombre de la red de los services.
      - name: Run the backend
        run: |
          docker run -d --name electoral-api --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=electoral_db \
            -e DB_USER=electoral_user \
            -e DB_PASSWORD=electoral_pass \
            -e SERVER_PORT=8080 \
            -e APP_JWT_SECRET=ci-only-contract-secret-at-least-32-chars \
            -e APP_JWT_REFRESH_PEPPER=ci-only-contract-pepper \
            -e APP_SEED_ADMIN_PASSWORD=admin12345 \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_S3_ENDPOINT=http://localhost:9000 \
            -e AWS_S3_REGION=us-east-1 \
            -e AWS_S3_BUCKET=electoral-evidences \
            -e AWS_S3_PATH_STYLE=true \
            electoral-api:contract

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend saludable"
              curl -s http://localhost:8080/actuator/health
              exit 0
            fi
            sleep 2
          done
          echo "El backend no llego a estar saludable"
          docker logs electoral-api
          exit 1

      - name: Run the contract suite
        working-directory: backend/contract-tests
        run: mvn -B verify -Dcontract.baseUrl=http://localhost:8080

      - name: Backend logs on failure
        if: failure()
        run: docker logs electoral-api

  # ===========================================================================
  # BACKEND QUARKUS
  # ===========================================================================
  # El unico backend. Este job afirma dos cosas que la suite de contrato no
  # puede ver: que la imagen levanta contra una base VACIA (arrancando dos
  # veces, porque en Quarkus Hibernate valida antes de que Liquibase cree el
  # schema) y que el health responde en /actuator/health del puerto principal.
  backend-quarkus:
    name: Backend Quarkus
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # El contexto de build es el modulo: el changelog de Liquibase vive en su
      # src/main/resources/database, asi que la imagen no depende de un hermano.
      - name: Build the Quarkus image
        run: docker build -t electoral-api-quarkus backend/electoral-api-quarkus

      # El backend arranca DOS veces a proposito.
      #
      # 1. Contra la base VACIA del service, con la migracion activada y la validacion de
      #    Hibernate apagada. Liquibase crea el schema, pero corre DESPUES de la validacion de
      #    Hibernate: contra una base vacia el arranque con `validate` (el default) revienta
      #    con "Schema validation: missing table [acta]". En Spring el orden era al reves, por
      #    eso nunca hizo falta y por eso esta fase no es obvia.
      # 2. Contra el schema ya creado, con los defaults: el backend tiene que levantar Y
      #    validar que el schema coincide con las entidades. Si alguien cambia una entidad sin
      #    cambiar el changelog, esta fase lo detecta en el CI y no en produccion.
      #
      # Esta fase 2 es el control de drift del backend: en compose el arranque corre con
      # `none` para que una base nueva levante, asi que el `validate` vive acá.
      - name: Run the Quarkus backend
        run: |
          boot_quarkus() {
            docker run -d --name electoral-api-quarkus --network host \
              -e DB_HOST=localhost \
              -e DB_PORT=5432 \
              -e DB_NAME=electoral_db \
              -e DB_USER=electoral_user \
              -e DB_PASSWORD=electoral_pass \
              -e SERVER_PORT=8080 \
              -e APP_JWT_SECRET=ci-only-contract-secret-at-least-32-chars \
              -e APP_JWT_REFRESH_PEPPER=ci-only-contract-pepper \
              "$@" \
              electoral-api-quarkus
          }

          wait_healthy() {
            for i in $(seq 1 90); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "El backend Quarkus no llego a estar saludable"
            docker logs electoral-api-quarkus
            return 1
          }

          boot_quarkus -e QUARKUS_LIQUIDASE_MIGRATE_AT_START=true -e QUARKUS_HIBERNATE_GENERATION=none
          wait_healthy || exit 1
          echo "Primer arranque: el backend creo el schema y quedo saludable"

          docker rm -f electoral-api-quarkus
          boot_quarkus
          wait_healthy || exit 1
          echo "Segundo arranque: el backend valido el schema y quedo saludable"
          curl -s http://localhost:8080/actuator/health
          echo

      - name: Quarkus logs on failure
        if: failure()
        run: docker logs electoral-api-quarkus

  # ===========================================================================
  # BACKEND QUARKUS TESTS
  # ===========================================================================
  # Los tests del modulo Quarkus (backend/electoral-api-quarkus). Son los que
  # la suite de contrato NO puede sustituir: la suite de regresion por contrato
  # habla solo HTTP, asi que no puede afirmar la politica RLS de Postgres ni el
  # formato del UUID. RlsIsolationIT corre contra un Postgres real de
  # Testcontainers, que levanta y baja solo — el job no necesita ningun
  # service de Postgres.
  backend-quarkus-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless corre con `ratchetFrom origin/develop`: compara contra esa
          # referencia para solo exigir formato en lo que cambio. El checkout por
          # defecto es depth 1 y deja el repo sin esa referencia, con lo cual el
          # build muere con "No such reference 'origin/develop'" — que no es un
          # problema de formato sino de que el baseline no esta.
          fetch-depth: 0

      - name: Fetch formatting baseline
        run: git fetch origin develop:refs/remotes/origin/develop || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Se usa `./mvnw` y no el Maven del runner: el wrapper pinea la misma
      # version (3.9.16) que usa el build nativo dentro de
      # `Dockerfile.native`, asi que los tests y la imagen nativa se compilan
      # con el mismo Maven. Si divergen, un test verde puede no reproducir el
      # fallo del AOT.
      # `verify` corre los tests (el surefire de este modulo incluye los *IT)
      # y ademas arma la app, asi que el job tambien cubre el packaging.
      - name: Run the Quarkus backend tests
        working-directory: backend/electoral-api-quarkus
        run: ./mvnw -B clean verify

  # ===========================================================================
  # LOAD TESTING (Baseline - 20 VUs)
  # ===========================================================================
  # Load test en cada PR: baseline 20 VUs para validar que el sistema tolera
  # carga mínima. Útil para detectar regresos de performance temprano.
  # SLA: p95 < 1.5s, p99 < 2s, failures < 2%
  load-test-baseline:
    name: Load Test Baseline (20 VUs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: electoral_db
          POSTGRES_USER: electoral_user
          POSTGRES_PASSWORD: electoral_pass
          POSTGRES_INITDB_ARGS: >-
            --encoding=UTF8
            --locale-provider=icu
            --icu-locale=es-EC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U electoral_user -d electoral_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create the evidence bucket
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli \
            --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket electoral-evidences

      - name: Build the backend image
        run: docker build -t electoral-api:load-test backend/electoral-api-quarkus

      - name: Start the backend
        run: |
          docker run -d --name electoral-api --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=electoral_db \
            -e DB_USER=electoral_user \
            -e DB_PASSWORD=electoral_pass \
            -e SERVER_PORT=8080 \
            -e APP_JWT_SECRET=ci-only-load-test-secret-at-least-32-chars \
            -e APP_JWT_REFRESH_PEPPER=ci-only-load-test-pepper \
            -e APP_SEED_ADMIN_PASSWORD=admin12345 \
            -e AWS_ACCESS_KEY_ID=rustfsadmin \
            -e AWS_SECRET_ACCESS_KEY=rustfsadmin123 \
            -e AWS_S3_ENDPOINT=http://localhost:9000 \
            -e AWS_S3_REGION=us-east-1 \
            -e AWS_S3_BUCKET=electoral-evidences \
            -e AWS_S3_PATH_STYLE=true \
            electoral-api:load-test

      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "✅ Backend healthy"
              curl -s http://localhost:8080/actuator/health | jq .
              exit 0
            fi
            echo "Waiting for backend... ($i/90)"
            sleep 2
          done
          echo "❌ Backend did not become healthy"
          docker logs electoral-api
          exit 1

      - name: Set up Node.js (for k6)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install k6
        run: |
          K6_VERSION=$(curl -s https://api.github.com/repos/grafana/k6/releases/latest | grep tag_name | cut -d'"' -f4)
          K6_VERSION=${K6_VERSION#v}
          curl -L "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" -o k6.tar.gz
          tar xzf k6.tar.gz
          sudo mv k6-v${K6_VERSION}-linux-amd64/k6 /usr/local/bin/
          rm -rf k6.tar.gz k6-v${K6_VERSION}-linux-amd64
          k6 version

      - name: Generate bcrypt hash for test password
        id: hash
        run: |
          # Generar hash bcrypt válido para 'SecurePass123!' usando PostgreSQL
          BCRYPT_HASH=$(PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT crypt('SecurePass123!', gen_salt('bf', 12));")
          echo "Generated bcrypt hash: ${BCRYPT_HASH:0:20}..."
          echo "hash=${BCRYPT_HASH}" >> $GITHUB_OUTPUT

      - name: Create seed data SQL
        run: |
          mkdir -p /tmp/seed
          HASH="${{ steps.hash.outputs.hash }}"

          cat > /tmp/seed/seed.sql << EOF
          INSERT INTO usuario (email, nombre, apellido, password_hash, estado_usuario, rol) VALUES
            ('obs1@electoral.ec', 'Observer', '1', '${HASH}', 'ACTIVO', 'OBSERVER'),
            ('obs2@electoral.ec', 'Observer', '2', '${HASH}', 'ACTIVO', 'OBSERVER'),
            ('obs3@electoral.ec', 'Observer', '3', '${HASH}', 'ACTIVO', 'OBSERVER'),
            ('obs4@electoral.ec', 'Observer', '4', '${HASH}', 'ACTIVO', 'OBSERVER'),
            ('obs5@electoral.ec', 'Observer', '5', '${HASH}', 'ACTIVO', 'OBSERVER'),
            ('coord1@electoral.ec', 'Coordinator', '1', '${HASH}', 'ACTIVO', 'COORDINATOR'),
            ('coord2@electoral.ec', 'Coordinator', '2', '${HASH}', 'ACTIVO', 'COORDINATOR'),
            ('admin@electoral.ec', 'Admin', 'Electoral', '${HASH}', 'ACTIVO', 'MASTER')
          ON CONFLICT (email) DO NOTHING;
          EOF

          echo "📋 Seed SQL:"
          cat /tmp/seed/seed.sql

      - name: Seed test data
        run: |
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -f /tmp/seed/seed.sql || {
            echo "❌ Seed data failed"
            exit 1
          }

      - name: Verify test data
        run: |
          echo "🔍 Checking if users were created..."
          PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db << 'SQL_CHECK'
            SELECT COUNT(*) as total_users FROM usuario;
            SELECT email, rol FROM usuario WHERE email LIKE '%@electoral.ec' ORDER BY email;
          SQL_CHECK

          USER_COUNT=$(PGPASSWORD=electoral_pass psql -h localhost -U electoral_user -d electoral_db -t -c \
            "SELECT COUNT(*) FROM usuario WHERE email LIKE '%@electoral.ec';")

          if [ "$USER_COUNT" -lt 5 ]; then
            echo "❌ Only $USER_COUNT test users created (expected at least 5)"
            exit 1
          fi
          echo "✅ $USER_COUNT test users created successfully"

      - name: Run k6 baseline test (20 VUs, 5 min)
        run: |
          cd frontend/tests/load
          mkdir -p results
          k6 run scenarios/login.js \
            --vus 20 \
            --duration 5m \
            --out json=results/baseline-pr-${GITHUB_RUN_ID}.json \
            -e API_HOST=localhost:8080
        env:
          K6_VUS: "20"
          K6_DURATION: "5m"

      - name: Extract and validate metrics
        run: |
          # Parse k6 results y validar SLAs
          RESULTS_FILE="frontend/tests/load/results/baseline-pr-${GITHUB_RUN_ID}.json"

          # Extract key metrics
          P95=$(jq -r '.metrics.http_req_duration.values.p95 // 0' "$RESULTS_FILE" | tr ',' '.')
          P99=$(jq -r '.metrics.http_req_duration.values.p99 // 0' "$RESULTS_FILE" | tr ',' '.')
          FAILURES=$(jq -r '.metrics.http_req_failed.values.rate // 0' "$RESULTS_FILE")

          echo "📊 Load Test Results (20 VUs, 5 min)"
          echo "======================================"
          echo "p95 latency: ${P95}ms (threshold: 1500ms)"
          echo "p99 latency: ${P99}ms (threshold: 2000ms)"
          echo "Failure rate: ${FAILURES}% (threshold: 2%)"
          echo ""

          # Convert to numeric for comparison
          P95_NUM=$(echo "$P95" | cut -d'.' -f1)
          P99_NUM=$(echo "$P99" | cut -d'.' -f1)

          if [ "$P95_NUM" -gt 1500 ]; then
            echo "❌ FAILED: p95 exceeds 1500ms"
            exit 1
          fi

          if [ "$P99_NUM" -gt 2000 ]; then
            echo "❌ FAILED: p99 exceeds 2000ms"
            exit 1
          fi

          echo "✅ Load test PASSED all SLAs"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-baseline-results-${{ github.run_id }}
          path: frontend/tests/load/results/
          retention-days: 30

      - name: Collect backend logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs electoral-api || true
          echo ""
          echo "=== K6 Results ==="
          cat frontend/tests/load/results/baseline-pr-*.json | jq '.metrics' | head -100

  frontend-format:
    name: Frontend Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        working-directory: frontend/app
        run: pnpm format:check

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: frontend/app
        run: pnpm lint

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests (Vitest)
        working-directory: frontend/app
        run: pnpm test:ci

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Build Angular Application
        working-directory: frontend/app
        run: pnpm build
