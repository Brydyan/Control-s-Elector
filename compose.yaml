# =============================================================================
# compose.yaml — Stack de desarrollo local (staging)
# =============================================================================
# Solo servicios de infraestructura: PostgreSQL y RustFS (emulación S3).
# El backend (Quarkus) y el frontend (Angular) corren nativos en el host:
#   - Backend: cd backend/electoral-api-quarkus && mvn quarkus:dev
#   - Frontend: cd frontend/app && ng serve
#
# Esto es a propósito. Cada cambio Java re-build nativo de GraalVM consume
# ~3-4 GB de RAM heap durante el AOT, lo cual satura Docker Desktop con
# el límite por defecto de ~4 GB. Correr JVM y dev server en el host evita
# eso, da iteración instantánea (hot reload) y no gasta memoria del VM Docker.
#
# El binario nativo de GraalVM queda reservado para deploy en Railway
# (donde el proceso de build corre fuera del desktop y tiene más memoria).
# El build nativo exige 6-8 GB de RAM, que es justamente lo que el desktop no
# tiene. Ver `backend/electoral-api-quarkus/Dockerfile.native`.
#
# Para correr el backend nativo desde el host (sin Docker), hace falta
# GraalVM/Mandrel y `mvn package -Dnative`; con la RAM que tiene esta maquina
# el AOT no entra. Para desarrollo, `mvn quarkus:dev` sobre la JVM.
#
# Uso (desarrollo local):
#   docker compose --profile dev up -d   # Postgres + Backend + RustFS
#   # en otra terminal: ng serve (frontend)
#
# Uso (staging):
#   docker compose --profile dev up -d   # Auto-deploy backend via deploy.sh + GitHub Actions
#
# Variables configurables (ver .env.example): DB_NAME, DB_USER, DB_PASSWORD,
# DB_PORT, APP_ENV, POSTGRES_MEM_LIMIT, RESTART_POLICY, SERVER_PORT.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Base de datos
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: electoral-postgres-${APP_ENV:-dev}
    profiles: ["dev"]
    environment:
      POSTGRES_DB: ${DB_NAME:-electoral_db}
      POSTGRES_USER: ${DB_USER:-electoral_user}
      # Dev trae default inseguro a propósito. Si querés sobreescribir,
      # pasá las variables en .env o en el comando con -e.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electoral_pass}
      # Initdb con ICU en lugar de glibc: postgres:16 (Debian) no trae
      # locales es_EC.UTF-8 vía glibc, pero ICU (compilado en la imagen)
      # sí resuelve es-EC sin generar locales del sistema.
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=icu
        --icu-locale=es-EC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          pg_isready
          -U ${DB_USER:-electoral_user}
          -d ${DB_NAME:-electoral_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: ${RESTART_POLICY:-no}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512M}

  # ---------------------------------------------------------------------------
  # Electoral API — Backend Quarkus (ejecutable nativo, sin JVM)
  # ---------------------------------------------------------------------------
  # La imagen es la NATIVA (Dockerfile.native): no lleva JVM. La de JVM
  # (Dockerfile) sigue existiendo para el job de CI que corre la suite de
  # contrato rapido; produccion corre el binario.
  electoral-api:
    build:
      context: ./backend/electoral-api-quarkus
      dockerfile: Dockerfile.native
    container_name: electoral-api-${APP_ENV:-dev}
    profiles: ["dev"]
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-electoral_db}
      DB_USER: ${DB_USER:-electoral_user}
      DB_PASSWORD: ${DB_PASSWORD:-electoral_pass}
      # Server
# The API listens on 80 inside the container so that the frontend's
      # nginx can reach it as `electoral-api:80`, the same shape the k8s
      # Service exposes (port 80 -> targetPort 8081).
      #
      # `SERVER_PORT` lo honra Quarkus via `quarkus.http.port=${SERVER_PORT:8080}`.
      # Tiene que quedar en 80: `ports` de abajo mapea 8083->80, el healthcheck
      # consulta localhost:80, y `frontend/app/nginx.conf` proxea a
      # `electoral-api:80`. Ponerlo en 8080 rompe los tres a la vez.
      SERVER_PORT: 80
      # Hibernate corre en `none` a proposito, y no es un descuido.
      #
      # En Spring, Liquibase corre ANTES de que Hibernate valida, asi que una
      # base recien creada levantaba sola. En Quarkus el orden es al reves:
      # Hibernate valida primero y una base vacia revienta con
      # `Schema validation: missing table [acta]`.
      #
      # Poner `validate` aca significaria que `docker compose up` contra una base
      # nueva no levanta. El control de drift (si una entidad cambia sin que el
      # changelog cambie) no se pierde: vive en el job `backend-quarkus` de CI,
      # que arranca el backend DOS veces — la primera con `none` para que Liquibase
      # cree el schema, la segunda con `validate` para afirmar que el schema
      # coincide con las entidades.
      QUARKUS_HIBERNATE_GENERATION: ${QUARKUS_HIBERNATE_GENERATION:-none}
      # Liquibase aplica las migraciones al arrancar. El backend Spring lo hacia
      # siempre (`spring.liquibase.enabled=true`); cuando era OFF era porque el
      # backend Spring migraba por su cuenta. Ahora es el unico dueño del schema.
      QUARKUS_LIQUIDASE_MIGRATE_AT_START: ${QUARKUS_LIQUIDASE_MIGRATE_AT_START:-true}
      # S3 / RustFS
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin123}
      AWS_S3_ENDPOINT: http://rustfs:${S3_PORT:-9000}
      AWS_S3_REGION: us-east-1
      AWS_S3_BUCKET: electoral-evidences
      AWS_S3_PATH_STYLE: "true"
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-change-in-prod-32chars-min-jwt-hmac-key}
      APP_JWT_REFRESH_PEPPER: ${APP_JWT_REFRESH_PEPPER:-dev-only-control-elector-refresh-pepper}
      # Bootstrap admin
      # El admin inicial lo siembra la migracion 026-admin-inicial.sql, no una
      # variable de entorno. En staging/produccion se corre con
      # QUARKUS_LIQUIDASE_CONTEXTS vacio para no crearlo: la cuenta se
      # provisiona a mano. Ver el aviso de seguridad en el changelog.
      QUARKUS_LIQUIDASE_CONTEXTS: ${QUARKUS_LIQUIDASE_CONTEXTS:-seed}
    ports:
      - "8083:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: ${RESTART_POLICY:-no}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # RustFS — Emulación S3 (storage de evidencias)
  # ---------------------------------------------------------------------------
  # NO se levanta por default. Usá `docker compose --profile dev --profile s3 up -d`
  # si querés correr RustFS en Docker. Por default, el backend apunta al
  # rustfs nativo en localhost:9000 si lo tenés corriendo.
  # Si activás este profile, primero asegurate de no tener rustfs nativo
  # (sudo systemctl stop rustfs) — chocan los puertos.
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: electoral-rustfs
    profiles: ["s3"]  # Solo se levanta con profile "s3"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin123}
      RUSTFS_ADDRESS: "0.0.0.0:${S3_PORT:-9000}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:${S3_CONSOLE_PORT:-9001}"
      RUSTFS_VOLUMES: /data
    ports:
      - "${S3_PORT:-9000}:${S3_PORT:-9000}" # API S3
      - "${S3_CONSOLE_PORT:-9001}:${S3_CONSOLE_PORT:-9001}" # Console web
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_PORT:-9000}/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Frontend — Angular + Ionic servido con Nginx y reverse proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    container_name: electoral-frontend-${APP_ENV:-dev}
    profiles: ["dev", "full"]
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      electoral-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: ${RESTART_POLICY:-no}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M


# -----------------------------------------------------------------------------
# Volúmenes persistentes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: electoral-postgres-${APP_ENV:-dev}-data
  rustfs_data:
    name: electoral-rustfs-data

# -----------------------------------------------------------------------------
# Red compartida — permite comunicación entre servicios por nombre
# -----------------------------------------------------------------------------
networks:
  default:
    name: electoral-${APP_ENV:-dev}-network
