apiVersion: v1
kind: Secret
metadata:
  name: electoral-api-secret
  namespace: control-electoral
type: Opaque
stringData:
  # Dueño de la base: migra, siembra y crea el rol de aplicación. Es el único
  # que puede crear el schema.
  DB_USER: "electoral_user"
  DB_PASSWORD: "electoral_pass"  # CHANGE IN PRODUCTION
  # Rol con el que CONECTA la API. Sin privilegios de superusuario y sin
  # BYPASSRLS: es lo que hace que las políticas de RLS se apliquen de verdad
  # (con el dueño, que es superusuario, Postgres las ignora).
  DB_APP_USER: "electoral_app"
  DB_APP_PASSWORD: "electoral_app_pass"  # CHANGE IN PRODUCTION
  SUPABASE_KEY: "your-supabase-key"
  SUPABASE_URL: "your-supabase-url"
  S3_ACCESS_KEY: "your-s3-access-key"
  S3_SECRET_KEY: "your-s3-secret-key"
