apiVersion: v1
kind: ConfigMap
metadata:
  name: electoral-api-config
  namespace: control-electoral
data:
  APP_ENV: "production"
  SERVER_PORT: "8081"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "electoral_db"
  # El nombre de la variable cambio con el corte a Quarkus, y el valor es el
  # mismo. Spring leia `JWT_SECRET`; Quarkus lee `APP_JWT_SECRET`
  # (`app.jwt.secret=${APP_JWT_SECRET:...}` en application.properties).
  #
  # Sin este rename el backend arrancaria igual, pero firmando con el DEFAULT de
  # desarrollo que esta embebido en el codigo: una clave conocida, publicada en
  # el repositorio, con la que cualquiera que lea el codigo puede forjar tokens.
  # El pepper no estaba en el ConfigMap y tampoco lo lee Spring; Quarkus si, y
  # con el mismo default de desarrollo.
  APP_JWT_SECRET: "your-jwt-secret-change-in-production"
  APP_JWT_REFRESH_PEPPER: "your-jwt-refresh-pepper-change-in-production"
  # El backend es el unico dueno del schema: sin esto nadie aplica las
  # migraciones de Liquibase. En Spring lo hacia `spring.liquibase.enabled=true`
  # de forma implicita.
  QUARKUS_LIQUIDASE_MIGRATE_AT_START: "true"
  CORS_ALLOWED_ORIGINS: "https://control.twintailcs.xyz"