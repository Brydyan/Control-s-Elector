apiVersion: v1
kind: ConfigMap
metadata:
  name: electoral-api-config
  namespace: control-electoral
data:
  APP_ENV: "production"
  SERVER_PORT: "8081"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "electoral_db"
  # El nombre de la variable cambio con el corte a Quarkus, y el valor es el
  # mismo. Spring leia `JWT_SECRET`; Quarkus lee `APP_JWT_SECRET`
  # (`app.jwt.secret=${APP_JWT_SECRET:...}` en application.properties).
  #
  # Sin este rename el backend arrancaria igual, pero firmando con el DEFAULT de
  # desarrollo que esta embebido en el codigo: una clave conocida, publicada en
  # el repositorio, con la que cualquiera que lea el codigo puede forjar tokens.
  # El pepper no estaba en el ConfigMap y tampoco lo lee Spring; Quarkus si, y
  # con el mismo default de desarrollo.
  APP_JWT_SECRET: "your-jwt-secret-change-in-production"
  APP_JWT_REFRESH_PEPPER: "your-jwt-refresh-pepper-change-in-production"
  # El backend es el unico dueno del schema: sin esto nadie aplica las
  # migraciones de Liquibase. En Spring lo hacia `spring.liquibase.enabled=true`
  # de forma implicita.
  #
  # OFF en la API: la migracion corre en un initContainer del mismo Deployment,
  # con las credenciales del dueno de la base y en modo migrate-only (migra y
  # sale). Asi el contenedor de la API no tiene las credenciales del dueno y no
  # puede saltarse RLS ni por accidente.
  QUARKUS_LIQUIDASE_MIGRATE_AT_START: "false"
  # Contextos de Liquibase. `seed` carga los datos de referencia que el producto
  # necesita en produccion (cargos, partidos, candidatos, JRVs, geografia).
  #
  # `bootstrap-admin` NO esta aqui a proposito: ese admin de arranque lleva una
  # contrasena conocida y versionada en el repo, asi que es un artefacto de
  # desarrollo. En produccion la cuenta se provisiona a mano con credenciales
  # propias.
  #
  # OJO: una lista de contextos VACIA no excluye nada — con `Contexts` vacio,
  # Liquibase corre todos los changesets. Por eso el valor es explicito y no
  # se deja en default.
  QUARKUS_LIQUIDASE_CONTEXTS: "seed"
  # Orígenes cross-origin que el backend acepta. Lista separada por comas, SIN comodin:
  # con `access-control-allow-credentials=true` el "*" es inválido por spec (el ACAO no
  # puede ser "*" con modo de credenciales "include") y abriría la API a cualquier
  # página que conozca el dominio.
  #
  # control.brydyan.me es la SPA de producción; k3s-staging.tailc8cd10.ts.net es
  # la de staging (mismo host que sirve el ingress del frontend). La SPA llama a la
  # API por proxy (/api), que es same-origin y no necesita CORS; esta lista importa
  # para el cliente móvil y para quien llame a la API por su hostname
  # (api.brydyan.me).
  #
  # Si esta variable falta, el backend arranca con el default de desarrollo
  # (localhost) y la API no responde cabeceras CORS para estos orígenes: el fallo
  # es visible en el navegador, no silencioso.
  CORS_ALLOWED_ORIGINS: "https://control.brydyan.me,https://k3s-staging.tailc8cd10.ts.net"