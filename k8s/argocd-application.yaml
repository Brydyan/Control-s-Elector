apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control-electoral
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Brydyan/Control-s-Elector.git
    targetRevision: develop
    path: k8s/

  destination:
    server: https://kubernetes.default.svc
    namespace: control-electoral

  syncPolicy:
    # Sincronización automática activada
    automated:
      prune: true        # Elimina recursos que se removieron del Git
      selfHeal: true     # Resincroniiza si hay drift manual

    syncOptions:
    - CreateNamespace=true  # Crea namespace si no existe
    - PrunePropagationPolicy=foreground
    - RespectIgnoreDifferences=true

  # Política de renovación
  revisionHistoryLimit: 5
