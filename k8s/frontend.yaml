apiVersion: apps/v1
kind: Deployment
metadata:
  name: electoral-frontend
  namespace: control-electoral
spec:
  replicas: 2
  selector:
    matchLabels:
      app: electoral-frontend
  template:
    metadata:
      labels:
        app: electoral-frontend
    spec:
      containers:
      - name: electoral-frontend
        image: brydyan12/control-electoral-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: electoral-frontend
  namespace: control-electoral
spec:
  selector:
    app: electoral-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: electoral-frontend-ingress
  namespace: control-electoral
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - control.twintailcs.xyz
    secretName: electoral-frontend-tls
  rules:
  - host: control.twintailcs.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: electoral-frontend
            port:
              number: 80
